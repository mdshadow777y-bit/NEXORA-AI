<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEXORA AI</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {

  --bg: #070b16;
  --panel: #0d1324;
  --border: rgba(255,255,255,0.08);

  --text: #f3f5ff;
  --muted: #8993aa;

  --user:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

}

body {

  min-height: 100vh;

  background:

    radial-gradient(
      circle at 20% 10%,
      rgba(124,58,237,0.12),
      transparent 30%
    ),

    radial-gradient(
      circle at 80% 20%,
      rgba(37,99,235,0.10),
      transparent 30%
    ),

    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow: hidden;

}


button {

  border: none;
  outline: none;

  cursor: pointer;

  color: var(--text);

  font-family: inherit;

}


/* =========================
   APP
========================= */

.app {

  height: 100vh;

  display: flex;

  flex-direction: column;

}


/* =========================
   HEADER
========================= */

header {

  height: 72px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 22px;

  border-bottom:
    1px solid var(--border);

  background:
    rgba(7,11,22,0.85);

  backdrop-filter:
    blur(18px);

  z-index: 20;

}


.brand {

  display: flex;

  align-items: center;

  gap: 12px;

}


.logo {

  width: 42px;
  height: 42px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 13px;

  font-size: 20px;

  font-weight: 800;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

}


.brand-text h1 {

  font-size: 17px;

}


.brand-text p {

  margin-top: 2px;

  color: var(--muted);

  font-size: 11px;

}


.header-actions {

  display: flex;

  gap: 8px;

}


.top-btn {

  height: 38px;

  padding: 0 13px;

  border:
    1px solid var(--border);

  border-radius: 10px;

  background:
    rgba(255,255,255,0.04);

  font-size: 12px;

  font-weight: 600;

}


.top-btn:hover {

  background:
    rgba(255,255,255,0.08);

}


.voice-active {

  border-color:
    rgba(124,58,237,0.5);

  background:
    rgba(124,58,237,0.14);

}


.stop-active {

  border-color:
    rgba(239,68,68,0.4);

  background:
    rgba(239,68,68,0.12);

}


/* =========================
   CHAT
========================= */

#chat {

  flex: 1;

  overflow-y: auto;

  padding:
    28px
    20px
    145px;

  scroll-behavior: smooth;

}


#chat::-webkit-scrollbar {

  width: 7px;

}


#chat::-webkit-scrollbar-thumb {

  background:
    rgba(255,255,255,0.10);

  border-radius: 10px;

}


/* =========================
   WELCOME
========================= */

.welcome {

  max-width: 760px;

  margin: 60px auto;

  text-align: center;

}


.welcome-icon {

  width: 72px;
  height: 72px;

  margin:
    auto auto 20px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 22px;

  font-size: 28px;

  font-weight: 800;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

}


.welcome h2 {

  font-size: 30px;

  margin-bottom: 10px;

}


.welcome p {

  color: var(--muted);

  font-size: 14px;

  line-height: 1.7;

}


/* =========================
   MESSAGE
========================= */

.message-row {

  width: 100%;

  max-width: 920px;

  margin:
    0 auto 20px;

  display: flex;

}


.message-row.user {

  justify-content:
    flex-end;

}


.message-row.ai {

  justify-content:
    flex-start;

}


.message {

  max-width:
    min(78%, 760px);

  padding:
    13px 15px;

  border-radius: 17px;

  line-height: 1.65;

  font-size: 14px;

  word-break: break-word;

}


.user .message {

  background:
    var(--user);

  border-bottom-right-radius:
    5px;

}


.ai .message {

  background:
    var(--panel);

  border:
    1px solid var(--border);

  border-bottom-left-radius:
    5px;

}


.message-content {

  white-space:
    normal;

}


/* =========================
   ACTIONS
========================= */

.message-actions {

  display: flex;

  gap: 6px;

  margin-top: 10px;

}


.action-btn {

  min-width: 30px;

  height: 29px;

  padding: 0 8px;

  border:
    1px solid var(--border);

  border-radius: 8px;

  background:
    rgba(255,255,255,0.04);

  color: #aab3c8;

  font-size: 12px;

}


/* =========================
   MARKDOWN
========================= */

.message-content strong {

  font-weight: 700;

}


.message-content ul,
.message-content ol {

  padding-left: 22px;

  margin: 8px 0;

}


.message-content li {

  margin: 4px 0;

}


.inline-code {

  padding:
    2px 6px;

  border-radius: 6px;

  background:
    rgba(255,255,255,0.08);

  font-family:
    Consolas,
    Monaco,
    monospace;

}


.code-wrapper {

  margin: 12px 0;

  overflow: hidden;

  border:
    1px solid
    rgba(255,255,255,0.09);

  border-radius: 10px;

  background:
    #070b13;

}


.code-header {

  height: 36px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 10px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.08);

  color: #8f99ad;

  font-size: 11px;

}


.copy-code {

  padding:
    5px 8px;

  border:
    1px solid
    rgba(255,255,255,0.08);

  border-radius: 6px;

  background:
    rgba(255,255,255,0.04);

  color: #b7c0d4;

  font-size: 10px;

}


pre {

  margin: 0;

  padding: 14px;

  overflow-x: auto;

  font-family:
    Consolas,
    Monaco,
    monospace;

  font-size: 12px;

  line-height: 1.6;

}


/* =========================
   THINKING
========================= */

.thinking {

  display: flex;

  gap: 5px;

}


.thinking span {

  width: 6px;

  height: 6px;

  border-radius: 50%;

  background:
    #a78bfa;

  animation:
    thinking 1.2s infinite;

}


.thinking span:nth-child(2) {

  animation-delay:
    .15s;

}


.thinking span:nth-child(3) {

  animation-delay:
    .30s;

}


@keyframes thinking {

  0%,80%,100% {

    opacity: .3;

    transform:
      translateY(0);

  }

  40% {

    opacity: 1;

    transform:
      translateY(-4px);

  }

}


/* =========================
   STREAM CURSOR
========================= */

.stream-cursor {

  display: inline-block;

  width: 7px;

  height: 17px;

  margin-left: 3px;

  vertical-align: -3px;

  background:
    #a78bfa;

  animation:
    blink .8s infinite;

}


@keyframes blink {

  50% {

    opacity: 0;

  }

}


/* =========================
   INPUT
========================= */

.input-area {

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  padding:
    15px
    18px
    20px;

  background:
    linear-gradient(
      to top,
      rgba(7,11,22,1) 55%,
      rgba(7,11,22,0)
    );

  z-index: 30;

}


.input-box {

  max-width: 920px;

  margin: auto;

  min-height: 58px;

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 8px;

  border:
    1px solid
    rgba(255,255,255,0.10);

  border-radius: 17px;

  background:
    rgba(13,19,36,0.95);

}


#messageInput {

  flex: 1;

  min-width: 0;

  height: 42px;

  padding: 0 10px;

  border: none;

  outline: none;

  background:
    transparent;

  color: white;

  font-family: inherit;

  font-size: 14px;

}


#messageInput::placeholder {

  color:
    #68738b;

}


.input-btn {

  width: 42px;

  height: 42px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 12px;

  background:
    rgba(255,255,255,0.05);

  color:
    #b8c1d5;

  font-size: 17px;

}


.send-btn {

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  color: white;

}


.stop-btn {

  background:
    linear-gradient(
      135deg,
      #dc2626,
      #ef4444
    );

  color: white;

}


.listening {

  background:
    rgba(239,68,68,0.16);

  color:
    #f87171;

}


@media(max-width:650px) {

  header {

    height: 64px;

    padding:
      0 12px;

  }

  .logo {

    width: 38px;
    height: 38px;

  }

  .brand-text p {

    display: none;

  }

  .top-btn {

    padding:
      0 9px;

    font-size: 11px;

  }

  #chat {

    padding:
      20px
      10px
      135px;

  }

  .message {

    max-width: 88%;

    font-size: 13px;

  }

  .welcome {

    margin:
      50px 15px;

  }

  .welcome h2 {

    font-size: 25px;

  }

  .input-area {

    padding:
      10px
      9px
      12px;

  }

}

</style>

</head>


<body>


<div class="app">


<header>

  <div class="brand">

    <div class="logo">
      N
    </div>

    <div class="brand-text">

      <h1>
        NEXORA AI
      </h1>

      <p>
        Your custom AI assistant
      </p>

    </div>

  </div>


  <div class="header-actions">

    <button
      id="voiceToggle"
      class="top-btn voice-active"
      onclick="toggleVoice()"
    >
      🔊 Voice ON
    </button>


    <button
      id="stopButton"
      class="top-btn"
      onclick="stopGenerating()"
      style="display:none"
    >
      🛑 Stop
    </button>


    <button
      class="top-btn"
      onclick="clearChat()"
    >
      Clear Chat
    </button>

  </div>

</header>



<main id="chat">


  <div
    id="welcome"
    class="welcome"
  >

    <div class="welcome-icon">
      N
    </div>

    <h2>
      Hello, I'm NEXORA AI
    </h2>

    <p>
      Your custom AI assistant.
      Ask me anything, write something,
      solve a problem, or build something together.
    </p>

  </div>


</main>



<div class="input-area">

  <div class="input-box">


    <button
      id="micButton"
      class="input-btn"
      onclick="toggleListening()"
    >
      🎙️
    </button>


    <input
      id="messageInput"
      type="text"
      autocomplete="off"
      placeholder="Message NEXORA AI..."
    >


    <button
      id="sendButton"
      class="input-btn send-btn"
      onclick="sendMessage()"
    >
      ➤
    </button>


  </div>

</div>


</div>



<script>


/* =========================================================
   API
========================================================= */

const API_URL =
  "https://nexora-ai-api.md-shadow777y.workers.dev/";


/* =========================================================
   DOM
========================================================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const micButton =
  document.getElementById("micButton");

const voiceToggle =
  document.getElementById("voiceToggle");

const stopButton =
  document.getElementById("stopButton");


/* =========================================================
   STATE
========================================================= */

let conversation = [];

let isBusy = false;

let voiceEnabled = true;

let recognition = null;

let isListening = false;

let shouldSendAfterVoice = false;

let abortController = null;


/* =========================================================
   MEMORY
========================================================= */

try {

  const saved =
    localStorage.getItem(
      "nexora_conversation"
    );

  if (saved) {

    const parsed =
      JSON.parse(saved);

    if (Array.isArray(parsed)) {

      conversation =
        parsed
          .filter(
            item =>
              item &&
              (
                item.role === "user" ||
                item.role === "assistant"
              ) &&
              typeof item.content === "string"
          )
          .slice(-50);

    }

  }

} catch {

  conversation = [];

}


/* =========================================================
   SAVE
========================================================= */

function saveConversation() {

  localStorage.setItem(
    "nexora_conversation",
    JSON.stringify(
      conversation.slice(-50)
    )
  );

}


/* =========================================================
   WELCOME
========================================================= */

function removeWelcome() {

  const welcome =
    document.getElementById(
      "welcome"
    );

  if (welcome) {

    welcome.remove();

  }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

  requestAnimationFrame(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

  return text

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   MARKDOWN
========================================================= */

function renderMarkdown(text) {

  if (!text) {

    return "";

  }


  let safe =
    escapeHTML(text);


  const codeBlocks = [];


  safe =
    safe.replace(
      /```([\w+-]*)\n?([\s\S]*?)```/g,
      (match, language, code) => {

        const id =
          codeBlocks.length;

        codeBlocks.push({

          language:
            language || "code",

          code:
            code.trim()

        });

        return (
          "___CODE_" +
          id +
          "___"
        );

      }
    );


  safe =
    safe.replace(
      /`([^`]+)`/g,
      '<span class="inline-code">$1</span>'
    );


  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  safe =
    safe.replace(
      /^### (.*)$/gm,
      "<strong>$1</strong>"
    );


  safe =
    safe.replace(
      /^## (.*)$/gm,
      "<strong>$1</strong>"
    );


  safe =
    safe.replace(
      /^# (.*)$/gm,
      "<strong>$1</strong>"
    );


  safe =
    safe.replace(
      /^\s*[-*] (.*)$/gm,
      "• $1"
    );


  safe =
    safe.replace(
      /\n/g,
      "<br>"
    );


  codeBlocks.forEach(
    (block, index) => {

      const html = `

        <div class="code-wrapper">

          <div class="code-header">

            <span>
              ${escapeHTML(
                block.language
              )}
            </span>

            <button
              class="copy-code"
              onclick="copyCode(this)"
            >
              Copy
            </button>

          </div>

          <pre data-code="${encodeURIComponent(
            block.code
          )}">${escapeHTML(
            block.code
          )}</pre>

        </div>

      `;


      safe =
        safe.replace(
          "___CODE_" +
          index +
          "___",
          html
        );

    }
  );


  return safe;

}


/* =========================================================
   COPY CODE
========================================================= */

async function copyCode(button) {

  const wrapper =
    button.closest(
      ".code-wrapper"
    );

  if (!wrapper) return;

  const pre =
    wrapper.querySelector(
      "pre"
    );

  const code =
    decodeURIComponent(
      pre.dataset.code || ""
    );

  try {

    await navigator.clipboard.writeText(
      code
    );

    button.textContent =
      "Copied!";

    setTimeout(
      () => {

        button.textContent =
          "Copy";

      },
      1200
    );

  } catch {

    button.textContent =
      "Failed";

  }

}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text) {

  removeWelcome();


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row user";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";


  message.textContent =
    text;


  row.appendChild(
    message
  );


  chat.appendChild(
    row
  );


  scrollToBottom();

}


/* =========================================================
   CREATE STREAMING AI MESSAGE
========================================================= */

function createStreamingMessage() {

  removeWelcome();


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";


  const content =
    document.createElement(
      "div"
    );

  content.className =
    "message-content";


  content.innerHTML =
    `<div class="thinking">
      <span></span>
      <span></span>
      <span></span>
    </div>`;


  message.appendChild(
    content
  );


  row.appendChild(
    message
  );


  chat.appendChild(
    row
  );


  scrollToBottom();


  return {

    row,
    message,
    content

  };

}


/* =========================================================
   ADD AI ACTIONS
========================================================= */

function addAIActions(
  message,
  text
) {


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "message-actions";


  const speakButton =
    document.createElement(
      "button"
    );

  speakButton.className =
    "action-btn";

  speakButton.textContent =
    "🔊";

  speakButton.onclick =
    () => {

      speak(text);

    };


  const copyButton =
    document.createElement(
      "button"
    );

  copyButton.className =
    "action-btn";

  copyButton.textContent =
    "Copy";

  copyButton.onclick =
    async () => {

      try {

        await navigator.clipboard.writeText(
          text
        );

        copyButton.textContent =
          "Copied!";

        setTimeout(
          () => {

            copyButton.textContent =
              "Copy";

          },
          1200
        );

      } catch {

        copyButton.textContent =
          "Failed";

      }

    };


  actions.appendChild(
    speakButton
  );

  actions.appendChild(
    copyButton
  );


  message.appendChild(
    actions
  );

}


/* =========================================================
   SEND MESSAGE — STREAMING
========================================================= */

async function sendMessage() {


  const message =
    input.value.trim();


  if (
    !message ||
    isBusy
  ) {

    return;

  }


  stopListening();

  stopSpeaking();


  isBusy =
    true;


  sendButton.disabled =
    true;

  micButton.disabled =
    true;


  stopButton.style.display =
    "block";


  stopButton.classList.add(
    "stop-active"
  );


  addUserMessage(
    message
  );


  /*
    IMPORTANT:

    Do not include current message
    inside messages.

    Worker adds it.
  */

  const previousMessages =
    conversation
      .filter(
        item =>
          item &&
          (
            item.role === "user" ||
            item.role === "assistant"
          )
      )
      .slice(-20);


  conversation.push({

    role:
      "user",

    content:
      message

  });


  saveConversation();


  input.value =
    "";


  const aiUI =
    createStreamingMessage();


  let fullReply =
    "";


  abortController =
    new AbortController();


  try {


    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                message,

              messages:
                previousMessages

            }),

          signal:
            abortController.signal

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Server error ${response.status}: ${errorText.slice(0,300)}`
      );

    }


    if (!response.body) {

      throw new Error(
        "Streaming is not supported by this response."
      );

    }


    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let buffer =
      "";


    while (true) {


      const {
        value,
        done
      } =
        await reader.read();


      if (done) {

        break;

      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      const events =
        buffer.split(
          "\n\n"
        );


      buffer =
        events.pop() || "";


      for (
        const event of events
      ) {


        const lines =
          event.split(
            /\r?\n/
          );


        for (
          const line of lines
        ) {


          const trimmed =
            line.trim();


          if (
            !trimmed.startsWith(
              "data:"
            )
          ) {

            continue;

          }


          const data =
            trimmed
              .slice(5)
              .trim();


          if (
            !data ||
            data === "[DONE]"
          ) {

            continue;

          }


          try {


            const parsed =
              JSON.parse(
                data
              );


            const delta =
              parsed
                ?.choices?.[0]
                ?.delta
                ?.content;


            if (
              typeof delta ===
              "string"
            ) {

              fullReply +=
                delta;

            }


          } catch {

            /*
              Ignore malformed
              SSE chunks.
            */

          }


          if (fullReply) {


            aiUI.content.innerHTML =
              renderMarkdown(
                fullReply
              ) +
              `<span class="stream-cursor"></span>`;


            scrollToBottom();

          }

        }

      }

    }


    /*
      Remove cursor.
    */

    aiUI.content.innerHTML =
      renderMarkdown(
        fullReply
      );


    if (!fullReply.trim()) {

      throw new Error(
        "NEXORA returned an empty response."
      );

    }


    addAIActions(
      aiUI.message,
      fullReply
    );


    conversation.push({

      role:
        "assistant",

      content:
        fullReply

    });


    saveConversation();


    if (voiceEnabled) {

      speak(
        fullReply
      );

    }


  } catch (error) {


    if (
      error.name ===
      "AbortError"
    ) {


      /*
        User clicked STOP.

        Keep whatever response
        was already generated.
      */


      if (
        fullReply.trim()
      ) {


        aiUI.content.innerHTML =
          renderMarkdown(
            fullReply
          );


        addAIActions(
          aiUI.message,
          fullReply
        );


        conversation.push({

          role:
            "assistant",

          content:
            fullReply

        });


        saveConversation();


      } else {


        aiUI.content.innerHTML =
          "Generation stopped.";

      }


    } else {


      console.error(
        "NEXORA ERROR:",
        error
      );


      aiUI.content.innerHTML =
        "⚠️ NEXORA request failed.<br><br>" +
        escapeHTML(
          error.message
        );

    }

  }


  abortController =
    null;


  isBusy =
    false;


  sendButton.disabled =
    false;

  micButton.disabled =
    false;


  stopButton.style.display =
    "none";


  stopButton.classList.remove(
    "stop-active"
  );


  input.focus();

}


/* =========================================================
   STOP GENERATING
========================================================= */

function stopGenerating() {


  if (
    abortController
  ) {

    abortController.abort();

  }

}


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   VOICE OUTPUT
========================================================= */

function speak(text) {


  if (
    !voiceEnabled ||
    !("speechSynthesis" in window)
  ) {

    return;

  }


  stopSpeaking();


  const cleanText =
    text

      .replace(
        /```[\s\S]*?```/g,
        ""
      )

      .replace(
        /[#*_>`]/g,
        ""
      )

      .replace(
        /\[(.*?)\]\(.*?\)/g,
        "$1"
      )

      .trim();


  if (!cleanText) {

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  const voices =
    speechSynthesis.getVoices();


  const isBangla =
    /[\u0980-\u09FF]/.test(
      cleanText
    );


  const voice =
    voices.find(
      v =>
        isBangla
          ? v.lang
              .toLowerCase()
              .startsWith("bn")
          : v.lang
              .toLowerCase()
              .startsWith("en")
    );


  if (voice) {

    utterance.voice =
      voice;

  }


  utterance.rate =
    1;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   STOP SPEAKING
========================================================= */

function stopSpeaking() {

  if (
    "speechSynthesis" in window
  ) {

    speechSynthesis.cancel();

  }

}


/* =========================================================
   VOICE TOGGLE
========================================================= */

function toggleVoice() {


  voiceEnabled =
    !voiceEnabled;


  if (!voiceEnabled) {


    stopSpeaking();


    voiceToggle.textContent =
      "🔇 Voice OFF";


    voiceToggle.classList.remove(
      "voice-active"
    );


  } else {


    voiceToggle.textContent =
      "🔊 Voice ON";


    voiceToggle.classList.add(
      "voice-active"
    );

  }

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

function setupRecognition() {


  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    return null;

  }


  const rec =
    new SpeechRecognition();


  rec.continuous =
    false;

  rec.interimResults =
    true;

  rec.maxAlternatives =
    1;


  rec.onstart =
    () => {


      isListening =
        true;


      micButton.classList.add(
        "listening"
      );


      micButton.textContent =
        "⏹️";


      stopSpeaking();

    };


  rec.onresult =
    event => {


      let finalText =
        "";

      let interimText =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {


        const transcript =
          event.results[i][0]
            .transcript;


        if (
          event.results[i]
            .isFinal
        ) {

          finalText +=
            transcript;

        } else {

          interimText +=
            transcript;

        }

      }


      const text =
        (
          finalText ||
          interimText
        ).trim();


      if (text) {

        input.value =
          text;

      }


      if (
        finalText.trim()
      ) {

        shouldSendAfterVoice =
          true;

      }

    };


  rec.onerror =
    error => {

      console.log(
        "Speech error:",
        error.error
      );

      shouldSendAfterVoice =
        false;

    };


  rec.onend =
    () => {


      isListening =
        false;


      micButton.classList.remove(
        "listening"
      );


      micButton.textContent =
        "🎙️";


      if (
        shouldSendAfterVoice &&
        input.value.trim() &&
        !isBusy
      ) {


        shouldSendAfterVoice =
          false;


        setTimeout(
          () => {

            sendMessage();

          },
          150
        );


      } else {

        shouldSendAfterVoice =
          false;

      }

    };


  return rec;

}


recognition =
  setupRecognition();


/* =========================================================
   LANGUAGE
========================================================= */

function detectSpeechLanguage() {


  if (
    /[\u0980-\u09FF]/.test(
      input.value
    )
  ) {

    return "bn-BD";

  }


  return "en-US";

}


/* =========================================================
   LISTEN
========================================================= */

function toggleListening() {


  if (!recognition) {


    alert(
      "Voice input is not supported. Please use Chrome or Edge."
    );


    return;

  }


  if (isListening) {


    shouldSendAfterVoice =
      false;


    try {

      recognition.stop();

    } catch {}

    return;

  }


  if (isBusy) {

    return;

  }


  stopSpeaking();


  recognition.lang =
    detectSpeechLanguage();


  shouldSendAfterVoice =
    false;


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "Recognition error:",
      error
    );

  }

}


/* =========================================================
   STOP LISTENING
========================================================= */

function stopListening() {


  if (
    recognition &&
    isListening
  ) {


    shouldSendAfterVoice =
      false;


    try {

      recognition.stop();

    } catch {}

  }

}


/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat() {


  if (
    !confirm(
      "Clear all NEXORA conversation memory?"
    )
  ) {

    return;

  }


  stopSpeaking();

  stopListening();

  stopGenerating();


  conversation =
    [];


  localStorage.removeItem(
    "nexora_conversation"
  );


  chat.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <div class="welcome-icon">
        N
      </div>

      <h2>
        Hello, I'm NEXORA AI
      </h2>

      <p>
        Your custom AI assistant.
        Ask me anything, write something,
        solve a problem, or build something together.
      </p>

    </div>

  `;


  input.value =
    "";

  input.focus();

}


/* =========================================================
   VOICES READY
========================================================= */

if (
  "speechSynthesis" in window
) {

  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis.getVoices();

    };

}


/* =========================================================
   RENDER SAVED CHAT
========================================================= */

function renderSavedConversation() {


  if (!conversation.length) {

    return;

  }


  removeWelcome();


  conversation.forEach(
    item => {


      if (
        item.role === "user"
      ) {

        addUserMessage(
          item.content
        );

      }

      else if (
        item.role === "assistant"
      ) {


        const ui =
          createStreamingMessage();


        ui.content.innerHTML =
          renderMarkdown(
            item.content
          );


        addAIActions(
          ui.message,
          item.content
        );

      }

    }
  );


  scrollToBottom();

}


window.addEventListener(
  "DOMContentLoaded",
  () => {

    renderSavedConversation();

    input.focus();

  }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopSpeaking();

  }
);


</script>
