<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;
      background: #11182b;
      border: 1px solid #293451;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .header {
      padding: 20px 25px;
      border-bottom: 1px solid #293451;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .message {
      max-width: 75%;
      padding: 14px 17px;
      margin-bottom: 15px;
      border-radius: 15px;
      line-height: 1.5;
    }

    .ai {
      background: #1b2540;
      border-top-left-radius: 4px;
    }

    .user {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      margin-left: auto;
      border-top-right-radius: 4px;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #293451;
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 15px;
      border: 1px solid #33415f;
      border-radius: 12px;
      outline: none;
      background: #0c1325;
      color: white;
      font-size: 15px;
    }

    #userInput:focus {
      border-color: #7c3aed;
    }

    #sendBtn {
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #sendBtn:hover {
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">N</div>

      <div>
        <h1>NEXORA AI</h1>
        <p>Your intelligent AI assistant</p>
      </div>
    </div>

    <div class="chat" id="chat">

      <div class="message ai">
        Hello! 👋 I'm NEXORA AI. How can I help you today?
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask NEXORA anything..."
      >

      <button id="sendBtn">Send</button>

    </div>

  </div>


  <script>

    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chat = document.getElementById("chat");


    function sendMessage() {

      const message = input.value.trim();

      if (message === "") return;


      // User message

      const userMessage = document.createElement("div");

      userMessage.className = "message user";

      userMessage.textContent = message;

      chat.appendChild(userMessage);


      input.value = "";


      // Demo AI response

      setTimeout(() => {

        const aiMessage = document.createElement("div");

        aiMessage.className = "message ai";

        aiMessage.textContent =
          "I'm currently running in demo mode. Soon I'll be connected to a real AI model! 🤖";

        chat.appendChild(aiMessage);

        chat.scrollTop = chat.scrollHeight;

      }, 700);


      chat.scrollTop = chat.scrollHeight;

    }


    sendBtn.addEventListener("click", sendMessage);


    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    });

  </script>

</body>
</html>
