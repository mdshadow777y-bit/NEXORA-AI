<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;
      background: #11182b;
      border: 1px solid #293451;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .header {
      padding: 20px 25px;
      border-bottom: 1px solid #293451;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .message {
      max-width: 75%;
      padding: 14px 17px;
      margin-bottom: 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai {
      background: #1b2540;
      border-top-left-radius: 4px;
    }

    .user {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      margin-left: auto;
      border-top-right-radius: 4px;
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #293451;
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 15px;
      border: 1px solid #33415f;
      border-radius: 12px;
      outline: none;
      background: #0c1325;
      color: white;
      font-size: 15px;
    }

    #userInput:focus {
      border-color: #7c3aed;
    }

    #sendBtn {
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    #sendBtn:hover {
      opacity: 0.9;
    }

    #sendBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">

      <div class="logo">
        N
      </div>

      <div>
        <h1>NEXORA AI</h1>
        <p>Your intelligent AI assistant</p>
      </div>

    </div>


    <div class="chat" id="chat">

      <div class="message ai">
        Hello! 👋 I'm NEXORA AI. How can I help you today?
      </div>

    </div>


    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask NEXORA anything..."
        autocomplete="off"
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>


  <script>

    // ============================================
    // NEXORA AI BACKEND
    // ============================================

    const API_URL =
      "https://nexora-ai-api.md-shadow777y.workers.dev/";


    // ============================================
    // DOM ELEMENTS
    // ============================================

    const input =
      document.getElementById("userInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chat");


    // ============================================
    // ADD MESSAGE TO CHAT
    // ============================================

    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;
    }


    // ============================================
    // SEND MESSAGE TO NEXORA AI
    // ============================================

    async function sendMessage() {

      const message =
        input.value.trim();


      // Don't send empty messages

      if (message === "") {
        return;
      }


      // Show user message

      addMessage(
        message,
        "user"
      );


      // Clear input

      input.value = "";


      // Disable button

      sendBtn.disabled = true;

      sendBtn.textContent =
        "Thinking...";


      // Temporary AI message

      const aiMessage =
        addMessage(
          "NEXORA is thinking...",
          "ai"
        );


      try {

        // Send request to Cloudflare Worker

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );


        // Read response

        const data =
          await response.json();


        // Check server response

        if (!response.ok) {

          throw new Error(
            data?.error ||
            "Something went wrong with the AI server."
          );

        }


        // Display AI response

        aiMessage.textContent =
          data.reply ||
          "Sorry, I couldn't generate a response.";


      } catch (error) {

        console.error(
          "NEXORA AI Error:",
          error
        );


        // Display user-friendly error

        aiMessage.textContent =
          "Sorry, something went wrong. Please try again.";

      }


      // Enable button again

      sendBtn.disabled = false;

      sendBtn.textContent =
        "Send";


      // Focus input

      input.focus();


      // Scroll to bottom

      chat.scrollTop =
        chat.scrollHeight;

    }


    // ============================================
    // SEND BUTTON
    // ============================================

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // ============================================
    // ENTER KEY
    // ============================================

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
