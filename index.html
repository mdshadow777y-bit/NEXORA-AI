<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b1020;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:95%;
  max-width:900px;
  height:90vh;
  background:#11182b;
  border:1px solid #293451;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

/* HEADER */

.header{
  padding:18px 22px;
  border-bottom:1px solid #293451;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:18px;
}

.header h1{
  font-size:22px;
}

.header p{
  font-size:12px;
  color:#94a3b8;
  margin-top:3px;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.top-btn{
  padding:9px 13px;
  border:1px solid #33415f;
  border-radius:9px;
  background:#0c1325;
  color:#cbd5e1;
  cursor:pointer;
  font-size:12px;
}

.top-btn:hover{
  border-color:#7c3aed;
  color:white;
}

.top-btn.active{
  border-color:#7c3aed;
  background:#1e293b;
}

/* CHAT */

.chat{
  flex:1;
  padding:25px;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.message-row{
  display:flex;
  width:100%;
  margin-bottom:18px;
}

.user-row{
  justify-content:flex-end;
}

.ai-row{
  justify-content:flex-start;
}

.message{
  max-width:78%;
  padding:14px 17px;
  border-radius:15px;
  line-height:1.6;
  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.user-message{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  border-top-right-radius:4px;
}

.ai-container{
  max-width:88%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.ai-message{
  background:#1b2540;
  border-top-left-radius:4px;
}

/* MARKDOWN */

.ai-message p{
  margin-bottom:12px;
}

.ai-message p:last-child{
  margin-bottom:0;
}

.ai-message strong{
  color:white;
}

.ai-message h1,
.ai-message h2,
.ai-message h3{
  margin:12px 0 8px;
}

.ai-message h1{
  font-size:22px;
}

.ai-message h2{
  font-size:19px;
}

.ai-message h3{
  font-size:17px;
}

.ai-message ul,
.ai-message ol{
  margin:8px 0 12px 22px;
}

.ai-message li{
  margin-bottom:5px;
}

.inline-code{
  background:#0b1222;
  border:1px solid #33415f;
  border-radius:5px;
  padding:2px 6px;
  font-family:Consolas,monospace;
}

/* CODE */

.code-box{
  width:100%;
  margin:12px 0;
  border:1px solid #33415f;
  border-radius:10px;
  overflow:hidden;
  background:#080d18;
}

.code-top{
  height:38px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#111827;
  border-bottom:1px solid #33415f;
}

.code-language{
  color:#94a3b8;
  font-size:11px;
}

.code-copy{
  border:1px solid #33415f;
  background:#0c1325;
  color:#cbd5e1;
  border-radius:6px;
  padding:5px 9px;
  cursor:pointer;
  font-size:11px;
}

.code-copy:hover{
  border-color:#7c3aed;
  color:white;
}

.code-box pre{
  margin:0;
  padding:15px;
  overflow-x:auto;
}

.code-box code{
  font-family:Consolas,"Courier New",monospace;
  font-size:13px;
  line-height:1.6;
  white-space:pre;
  color:#e2e8f0;
}

/* AI ACTIONS */

.ai-actions{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.action-btn{
  width:32px;
  height:32px;
  border:1px solid #33415f;
  border-radius:8px;
  background:#0c1325;
  color:white;
  cursor:pointer;
}

.action-btn:hover{
  border-color:#7c3aed;
}

/* THINKING */

.thinking{
  display:flex;
  align-items:center;
  gap:8px;
  padding:14px 17px;
  background:#1b2540;
  border-radius:15px;
  border-top-left-radius:4px;
  color:#94a3b8;
}

.dots{
  display:flex;
  gap:4px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#94a3b8;
  animation:dotPulse 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes dotPulse{
  0%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* INPUT */

.input-area{
  padding:17px;
  border-top:1px solid #293451;
  display:flex;
  gap:9px;
}

#userInput{
  flex:1;
  min-width:0;
  padding:15px;
  border:1px solid #33415f;
  border-radius:12px;
  outline:none;
  background:#0c1325;
  color:white;
  font-size:15px;
}

#userInput:focus{
  border-color:#7c3aed;
}

#micBtn{
  width:50px;
  flex-shrink:0;
  border:1px solid #33415f;
  border-radius:12px;
  background:#0c1325;
  color:white;
  font-size:19px;
  cursor:pointer;
}

#micBtn:hover{
  border-color:#7c3aed;
}

#micBtn.listening{
  background:#dc2626;
  border-color:#ef4444;
  animation:micPulse 1s infinite;
}

@keyframes micPulse{
  0%{
    box-shadow:0 0 0 0 rgba(239,68,68,.5);
  }
  70%{
    box-shadow:0 0 0 10px rgba(239,68,68,0);
  }
  100%{
    box-shadow:0 0 0 0 rgba(239,68,68,0);
  }
}

#sendBtn{
  flex-shrink:0;
  padding:0 22px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#sendBtn:hover{
  opacity:.9;
}

#sendBtn:disabled,
#micBtn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* MOBILE */

@media(max-width:600px){

  .app{
    width:100%;
    height:100vh;
    border-radius:0;
  }

  .header{
    padding:14px;
  }

  .header p{
    display:none;
  }

  .header h1{
    font-size:19px;
  }

  .logo{
    width:38px;
    height:38px;
  }

  .header-buttons{
    gap:5px;
  }

  .top-btn{
    padding:8px 9px;
  }

  .chat{
    padding:15px;
  }

  .message{
    max-width:92%;
  }

  .ai-container{
    max-width:96%;
  }

  .input-area{
    padding:11px;
  }

  #sendBtn{
    padding:0 15px;
  }

  #micBtn{
    width:46px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <div class="brand">

      <div class="logo">N</div>

      <div>
        <h1>NEXORA AI</h1>
        <p>Your intelligent AI assistant</p>
      </div>

    </div>

    <div class="header-buttons">

      <button
        id="voiceToggle"
        class="top-btn active">
        🔊 Voice ON
      </button>

      <button
        id="clearBtn"
        class="top-btn">
        Clear Chat
      </button>

    </div>

  </div>


  <!-- CHAT -->
  <div
    id="chat"
    class="chat">
  </div>


  <!-- INPUT -->
  <div class="input-area">

    <input
      id="userInput"
      type="text"
      placeholder="Ask NEXORA anything..."
      autocomplete="off"
    >

    <button
      id="micBtn"
      title="Voice Input">
      🎤
    </button>

    <button
      id="sendBtn">
      Send
    </button>

  </div>

</div>


<script>

/* ==========================================
   NEXORA CONFIG
========================================== */

const API_URL =
"https://nexora-ai-api.md-shadow777y.workers.dev/";


/* ==========================================
   ELEMENTS
========================================== */

const input =
document.getElementById("userInput");

const chat =
document.getElementById("chat");

const sendBtn =
document.getElementById("sendBtn");

const micBtn =
document.getElementById("micBtn");

const voiceToggle =
document.getElementById("voiceToggle");

const clearBtn =
document.getElementById("clearBtn");


/* ==========================================
   MEMORY
========================================== */

let conversation = [];

try{

  conversation =
    JSON.parse(
      localStorage.getItem(
        "nexoraConversation"
      )
    ) || [];

}catch(error){

  conversation = [];

}


/* ==========================================
   VOICE
========================================== */

let voiceEnabled = true;

let speaking = false;

let recognition = null;

let listening = false;


/* ==========================================
   SAVE
========================================== */

function saveConversation(){

  localStorage.setItem(
    "nexoraConversation",
    JSON.stringify(
      conversation
    )
  );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   MARKDOWN
========================================== */

function markdown(text){

  /*
    First protect code blocks.
  */

  const codeBlocks = [];


  text = String(text).replace(
    /```([a-zA-Z0-9_+#.-]*)\s*\n([\s\S]*?)```/g,
    function(match,language,code){

      const index =
        codeBlocks.length;

      codeBlocks.push({
        language:
          language || "code",
        code:
          code.trim()
      });

      return (
        "\n\n@@CODE" +
        index +
        "@@\n\n"
      );

    }
  );


  let html =
    escapeHTML(text);


  /*
    Headings
  */

  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  /*
    Bold
  */

  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  /*
    Inline code
  */

  html =
    html.replace(
      /`([^`]+)`/g,
      '<span class="inline-code">$1</span>'
    );


  /*
    Bullet lists
  */

  html =
    html.replace(
      /^\s*[-*]\s+(.+)$/gm,
      "<li>$1</li>"
    );


  /*
    Numbered lists
  */

  html =
    html.replace(
      /^\s*\d+[.)]\s+(.+)$/gm,
      "<li>$1</li>"
    );


  /*
    Paragraph breaks
  */

  html =
    html.replace(
      /\n\n+/g,
      "</p><p>"
    );


  html =
    html.replace(
      /\n/g,
      "<br>"
    );


  html =
    "<p>" +
    html +
    "</p>";


  /*
    Restore code blocks
  */

  codeBlocks.forEach(
    function(block,index){

      const safeCode =
        escapeHTML(
          block.code
        );


      const codeHTML = `

        <div class="code-box">

          <div class="code-top">

            <span class="code-language">
              ${escapeHTML(
                block.language
              )}
            </span>

            <button
              class="code-copy"
              onclick="copyCode(this)">
              Copy
            </button>

          </div>

          <pre><code>${safeCode}</code></pre>

        </div>

      `;


      html =
        html.replace(
          "<p>@@CODE" +
          index +
          "@@</p>",
          codeHTML
        );


      html =
        html.replace(
          "@@CODE" +
          index +
          "@@",
          codeHTML
        );

    }
  );


  return html;

}


/* ==========================================
   COPY CODE
========================================== */

async function copyCode(button){

  const box =
    button.closest(
      ".code-box"
    );

  if(!box){
    return;
  }


  const code =
    box.querySelector(
      "code"
    );


  if(!code){
    return;
  }


  try{

    await navigator.clipboard.writeText(
      code.innerText
    );

    button.textContent =
      "Copied!";

    setTimeout(
      function(){

        button.textContent =
          "Copy";

      },
      1500
    );

  }catch(error){

    console.error(
      "Copy failed:",
      error
    );

  }

}


/* ==========================================
   COPY RESPONSE
========================================== */

async function copyResponse(button){

  const container =
    button.closest(
      ".ai-container"
    );

  if(!container){
    return;
  }


  const message =
    container.querySelector(
      ".ai-message"
    );

  if(!message){
    return;
  }


  try{

    await navigator.clipboard.writeText(
      message.innerText
    );

    button.textContent =
      "✓";

    setTimeout(
      function(){

        button.textContent =
          "📋";

      },
      1500
    );

  }catch(error){

    console.error(
      "Copy failed:",
      error
    );

  }

}


/* ==========================================
   SPEECH OUTPUT
========================================== */

function stopVoice(){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

  }

  speaking = false;

  updateVoiceButton();

}


function speak(text){

  if(!voiceEnabled){
    return;
  }

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  stopVoice();


  const cleanText =
    String(text)
      .replace(/```[\s\S]*?```/g,"")
      .replace(/`([^`]+)`/g,"$1")
      .replace(/\*\*(.*?)\*\*/g,"$1")
      .replace(/\n+/g," ")
      .trim();


  if(!cleanText){
    return;
  }


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  utterance.rate = 1;

  utterance.pitch = 1;

  utterance.volume = 1;


  const voices =
    window.speechSynthesis
      .getVoices();


  const voice =
    voices.find(
      function(v){

        return (
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("en")
        );

      }
    );


  if(voice){
    utterance.voice = voice;
  }


  utterance.onstart =
    function(){

      speaking = true;

      updateVoiceButton();

    };


  utterance.onend =
    function(){

      speaking = false;

      updateVoiceButton();

    };


  utterance.onerror =
    function(){

      speaking = false;

      updateVoiceButton();

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==========================================
   VOICE BUTTON
========================================== */

function updateVoiceButton(){

  if(speaking){

    voiceToggle.textContent =
      "⏹ Stop Voice";

    voiceToggle.classList.add(
      "active"
    );

  }else if(voiceEnabled){

    voiceToggle.textContent =
      "🔊 Voice ON";

    voiceToggle.classList.add(
      "active"
    );

  }else{

    voiceToggle.textContent =
      "🔇 Voice OFF";

    voiceToggle.classList.remove(
      "active"
    );

  }

}


voiceToggle.addEventListener(
  "click",
  function(){

    if(speaking){

      stopVoice();

      return;

    }


    voiceEnabled =
      !voiceEnabled;


    if(!voiceEnabled){

      stopVoice();

    }


    updateVoiceButton();

  }
);


/* ==========================================
   ADD MESSAGE
========================================== */

function addMessage(
  role,
  content,
  autoVoice = false
){

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message-row " +
    (
      role === "user"
      ? "user-row"
      : "ai-row"
    );


  if(role === "user"){

    const message =
      document.createElement(
        "div"
      );


    message.className =
      "message user-message";


    message.textContent =
      content;


    row.appendChild(
      message
    );

  }else{

    const container =
      document.createElement(
        "div"
      );


    container.className =
      "ai-container";


    const message =
      document.createElement(
        "div"
      );


    message.className =
      "message ai-message";


    message.innerHTML =
      markdown(
        content
      );


    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "ai-actions";


    const speaker =
      document.createElement(
        "button"
      );


    speaker.className =
      "action-btn";

    speaker.textContent =
      "🔊";

    speaker.title =
      "Read response";


    speaker.onclick =
      function(){

        speak(
          content
        );

      };


    const copy =
      document.createElement(
        "button"
      );


    copy.className =
      "action-btn";

    copy.textContent =
      "📋";

    copy.title =
      "Copy response";


    copy.onclick =
      function(){

        copyResponse(
          copy
        );

      };


    actions.appendChild(
      speaker
    );

    actions.appendChild(
      copy
    );


    container.appendChild(
      message
    );

    container.appendChild(
      actions
    );


    row.appendChild(
      container
    );


    if(autoVoice){

      /*
        Start voice after the AI message
        has been placed on the screen.
      */

      setTimeout(
        function(){

          speak(
            content
          );

        },
        80
      );

    }

  }


  chat.appendChild(
    row
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* ==========================================
   THINKING
========================================== */

function showThinking(){

  const row =
    document.createElement(
      "div"
    );


  row.id =
    "thinkingMessage";


  row.className =
    "message-row ai-row";


  row.innerHTML = `

    <div class="thinking">

      <span>Thinking</span>

      <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

    </div>

  `;


  chat.appendChild(
    row
  );


  chat.scrollTop =
    chat.scrollHeight;

}


function removeThinking(){

  const element =
    document.getElementById(
      "thinkingMessage"
    );


  if(element){

    element.remove();

  }

}


/* ==========================================
   LOAD MEMORY
========================================== */

function loadConversation(){

  chat.innerHTML = "";


  if(
    conversation.length === 0
  ){

    addMessage(
      "assistant",
      "Hello! 👋 I'm NEXORA AI. How can I help you today?"
    );

    return;

  }


  conversation.forEach(
    function(item){

      if(
        item &&
        (
          item.role === "user" ||
          item.role === "assistant"
        ) &&
        typeof item.content === "string"
      ){

        addMessage(
          item.role,
          item.content,
          false
        );

      }

    }
  );

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage(){

  const message =
    input.value.trim();


  if(!message){
    return;
  }


  /*
    Stop any previous voice.
  */

  stopVoice();


  input.disabled = true;

  sendBtn.disabled = true;

  micBtn.disabled = true;


  /*
    Show user message.
  */

  addMessage(
    "user",
    message
  );


  /*
    IMPORTANT:
    Send only previous history.
    Current message is sent separately.
  */

  const previousMessages =
    conversation
      .filter(
        function(item){

          return (
            item.role === "user" ||
            item.role === "assistant"
          );

        }
      )
      .slice(-20);


  conversation.push({

    role:"user",

    content:message

  });


  saveConversation();


  input.value = "";


  showThinking();


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              messages:
                previousMessages

            })
        }
      );


    const data =
      await response.json();


    removeThinking();


    if(!response.ok){

      console.error(
        "API ERROR:",
        data
      );


      throw new Error(
        data?.error ||
        "API request failed."
      );

    }


    const reply =
      data?.reply;


    if(
      !reply ||
      typeof reply !== "string"
    ){

      throw new Error(
        "AI returned an empty response."
      );

    }


    /*
      Show AI response.
    */

    addMessage(
      "assistant",
      reply,
      true
    );


    /*
      Save AI response.
    */

    conversation.push({

      role:"assistant",

      content:reply

    });


    saveConversation();


  }catch(error){

    removeThinking();


    console.error(
      "NEXORA ERROR:",
      error
    );


    addMessage(
      "assistant",
      "Sorry, I couldn't connect to NEXORA AI right now. Please try again."
    );

  }


  input.disabled = false;

  sendBtn.disabled = false;

  micBtn.disabled = false;

  input.focus();

}


/* ==========================================
   SEND EVENTS
========================================== */

sendBtn.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ==========================================
   CLEAR CHAT
========================================== */

clearBtn.addEventListener(
  "click",
  function(){

    const ok =
      confirm(
        "Clear all NEXORA AI conversation history?"
      );


    if(!ok){
      return;
    }


    stopVoice();


    conversation = [];


    localStorage.removeItem(
      "nexoraConversation"
    );


    loadConversation();

  }
);


/* ==========================================
   VOICE INPUT
========================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  /*
    English voice recognition.
    We can add Bangla mode later.
  */

  recognition.lang =
    "en-US";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    function(){

      listening = true;


      /*
        Stop AI voice when user starts
        speaking.
      */

      stopVoice();


      micBtn.classList.add(
        "listening"
      );


      micBtn.textContent =
        "⏹";


      input.placeholder =
        "Listening...";

    };


  recognition.onresult =
    function(event){

      let text = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        text +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        text;

    };


  recognition.onend =
    function(){

      listening = false;


      micBtn.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎤";


      input.placeholder =
        "Ask NEXORA anything...";


      /*
        Automatically send whatever
        was recognized.
      */

      if(
        input.value.trim() &&
        !input.disabled
      ){

        setTimeout(
          function(){

            sendMessage();

          },
          200
        );

      }

    };


  recognition.onerror =
    function(event){

      console.error(
        "Speech recognition error:",
        event.error
      );


      listening = false;


      micBtn.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎤";


      input.placeholder =
        "Ask NEXORA anything...";

    };


  micBtn.addEventListener(
    "click",
    function(){

      if(input.disabled){
        return;
      }


      if(listening){

        recognition.stop();

        return;

      }


      try{

        recognition.start();

      }catch(error){

        console.error(
          "Recognition start error:",
          error
        );

      }

    }
  );


}else{

  micBtn.disabled = true;

  micBtn.title =
    "Voice input is not supported by this browser";

}


/* ==========================================
   LOAD
========================================== */

updateVoiceButton();

loadConversation();

input.focus();

</script>

</body>
</html>
