<script>

/* ==========================================
   NEXORA AI — CHATGPT STYLE VOICE SYSTEM
========================================== */

const API_URL =
"https://nexora-ai-api.md-shadow777y.workers.dev/";


/* ==========================================
   ELEMENTS
========================================== */

const input =
document.getElementById("userInput");

const sendBtn =
document.getElementById("sendBtn");

const clearBtn =
document.getElementById("clearBtn");

const micBtn =
document.getElementById("micBtn");

const voiceToggle =
document.getElementById("voiceToggle");

const chat =
document.getElementById("chat");


/* ==========================================
   MEMORY
========================================== */

let conversation =
JSON.parse(
  localStorage.getItem("nexoraConversation")
) || [];


/* ==========================================
   VOICE STATE
========================================== */

let voiceEnabled = true;

let isListening = false;

let isSpeaking = false;

let recognition = null;

let speechQueue = [];

let currentSpeechIndex = 0;


/* ==========================================
   SAVE MEMORY
========================================== */

function saveConversation(){

  localStorage.setItem(
    "nexoraConversation",
    JSON.stringify(conversation)
  );

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   MARKDOWN
========================================== */

function renderInlineMarkdown(text){

  let result =
    escapeHTML(text);

  result =
    result.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  result =
    result.replace(
      /(?<!\*)\*([^*]+)\*(?!\*)/g,
      "<em>$1</em>"
    );

  result =
    result.replace(
      /`([^`]+)`/g,
      '<span class="inline-code">$1</span>'
    );

  return result;

}


/* ==========================================
   CODE BLOCKS
========================================== */

function parseCodeBlocks(text){

  const blocks = [];

  const regex =
    /^(`{2,3})([a-zA-Z0-9_+#.-]*)[ \t]*\r?\n([\s\S]*?)^\1[ \t]*$/gm;

  const cleaned =
    text.replace(
      regex,
      function(
        match,
        fence,
        language,
        code
      ){

        const index =
          blocks.length;

        blocks.push({
          language:
            language || "code",
          code:
            code.replace(/\s+$/,"")
        });

        return (
          "\n\n" +
          `[[[NEXORA_CODE_${index}]]]` +
          "\n\n"
        );

      }
    );

  return {
    text:cleaned,
    blocks:blocks
  };

}


/* ==========================================
   MARKDOWN RENDER
========================================== */

function renderMarkdown(text){

  const parsed =
    parseCodeBlocks(text);

  const blocks =
    parsed.blocks;

  const lines =
    parsed.text.split(/\r?\n/);

  let html = "";

  let paragraph = [];

  let listType = null;


  function closeParagraph(){

    if(
      paragraph.length === 0
    ){
      return;
    }

    html +=
      `<p>${renderInlineMarkdown(
        paragraph.join("<br>")
      )}</p>`;

    paragraph = [];

  }


  function closeList(){

    if(!listType){
      return;
    }

    html +=
      listType === "ul"
      ? "</ul>"
      : "</ol>";

    listType = null;

  }


  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const raw =
      lines[i];

    const line =
      raw.trim();


    if(line === ""){

      closeParagraph();
      closeList();

      continue;

    }


    const codeMatch =
      line.match(
        /^\[\[\[NEXORA_CODE_(\d+)\]\]\]$/
      );


    if(codeMatch){

      closeParagraph();
      closeList();

      const index =
        Number(codeMatch[1]);

      const block =
        blocks[index];


      if(block){

        html += `

        <div class="code-wrapper">

          <div class="code-header">

            <span class="code-language">
              ${escapeHTML(
                block.language
              )}
            </span>

            <button
              class="code-copy"
              onclick="copyCode(this)"
            >
              Copy
            </button>

          </div>

          <pre><code>${escapeHTML(
            block.code
          )}</code></pre>

        </div>

        `;

      }

      continue;

    }


    if(line.startsWith("### ")){

      closeParagraph();
      closeList();

      html +=
        `<h3>${renderInlineMarkdown(
          line.substring(4)
        )}</h3>`;

      continue;

    }


    if(line.startsWith("## ")){

      closeParagraph();
      closeList();

      html +=
        `<h2>${renderInlineMarkdown(
          line.substring(3)
        )}</h2>`;

      continue;

    }


    if(line.startsWith("# ")){

      closeParagraph();
      closeList();

      html +=
        `<h1>${renderInlineMarkdown(
          line.substring(2)
        )}</h1>`;

      continue;

    }


    const unordered =
      line.match(
        /^[-*•]\s+(.*)$/
      );


    if(unordered){

      closeParagraph();

      if(listType !== "ul"){

        closeList();

        html += "<ul>";

        listType = "ul";

      }

      html +=
        `<li>${renderInlineMarkdown(
          unordered[1]
        )}</li>`;

      continue;

    }


    const ordered =
      line.match(
        /^\d+[.)]\s+(.*)$/
      );


    if(ordered){

      closeParagraph();

      if(listType !== "ol"){

        closeList();

        html += "<ol>";

        listType = "ol";

      }

      html +=
        `<li>${renderInlineMarkdown(
          ordered[1]
        )}</li>`;

      continue;

    }


    if(
      line === "---" ||
      line === "***" ||
      line === "___"
    ){

      closeParagraph();
      closeList();

      html += "<hr>";

      continue;

    }


    closeList();

    paragraph.push(raw);

  }


  closeParagraph();
  closeList();


  return html;

}


/* ==========================================
   COPY CODE
========================================== */

async function copyCode(button){

  const wrapper =
    button.closest(
      ".code-wrapper"
    );

  if(!wrapper){
    return;
  }

  const code =
    wrapper.querySelector(
      "code"
    );

  if(!code){
    return;
  }

  try{

    await navigator.clipboard.writeText(
      code.innerText
    );

    button.textContent =
      "Copied!";

    setTimeout(
      ()=>{
        button.textContent =
          "Copy";
      },
      1500
    );

  }catch(error){

    console.error(
      "Copy error:",
      error
    );

  }

}


/* ==========================================
   COPY RESPONSE
========================================== */

async function copyResponse(button){

  const container =
    button.closest(
      ".ai-container"
    );

  if(!container){
    return;
  }

  const content =
    container.querySelector(
      ".ai-content"
    );

  if(!content){
    return;
  }

  try{

    await navigator.clipboard.writeText(
      content.innerText
    );

    button.textContent =
      "✓";

    setTimeout(
      ()=>{
        button.textContent =
          "📋";
      },
      1500
    );

  }catch(error){

    console.error(
      "Copy response error:",
      error
    );

  }

}


/* ==========================================
   CHATGPT STYLE VOICE
========================================== */

/*
  Split long AI response into natural
  speech chunks.

  Example:

  "Hello Fahim. How are you?
   I can help you with coding."

  becomes:

  1. Hello Fahim.
  2. How are you?
  3. I can help you with coding.
*/

function createSpeechChunks(text){

  let cleanText =
    text
      .replace(/```[\s\S]*?```/g,"")
      .replace(/`([^`]+)`/g,"$1")
      .replace(/\*\*(.*?)\*\*/g,"$1")
      .replace(/\*(.*?)\*/g,"$1")
      .replace(/#+\s/g,"")
      .trim();


  if(!cleanText){
    return [];
  }


  /*
    Split after sentences.
  */

  const sentences =
    cleanText.match(
      /[^.!?।]+[.!?।]+|[^.!?।]+$/g
    );


  if(!sentences){
    return [cleanText];
  }


  const chunks = [];

  let current = "";


  sentences.forEach(
    sentence => {

      const next =
        (current + " " + sentence)
          .trim();


      /*
        Keep chunks reasonably short
        for natural voice.
      */

      if(next.length > 180){

        if(current){
          chunks.push(current);
        }

        current =
          sentence.trim();

      }else{

        current =
          next;

      }

    }
  );


  if(current){
    chunks.push(current);
  }


  return chunks;

}


/* ==========================================
   START SPEECH QUEUE
========================================== */

function speakResponse(text){

  if(!voiceEnabled){
    return;
  }


  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  stopSpeaking();


  speechQueue =
    createSpeechChunks(text);


  currentSpeechIndex = 0;


  if(
    speechQueue.length === 0
  ){
    return;
  }


  speakNextChunk();

}


/* ==========================================
   SPEAK NEXT CHUNK
========================================== */

function speakNextChunk(){

  if(!voiceEnabled){
    stopSpeaking();
    return;
  }


  if(
    currentSpeechIndex >=
    speechQueue.length
  ){

    isSpeaking = false;

    updateVoiceButton();

    return;

  }


  isSpeaking = true;

  updateVoiceButton();


  const text =
    speechQueue[
      currentSpeechIndex
    ];


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.rate = 1.02;

  utterance.pitch = 1;

  utterance.volume = 1;


  /*
    Pick a natural English voice
    when available.
  */

  const voices =
    window.speechSynthesis
      .getVoices();


  const preferredVoice =
    voices.find(
      voice =>
        voice.lang &&
        (
          voice.lang
            .toLowerCase()
            .startsWith("en-us") ||
          voice.lang
            .toLowerCase()
            .startsWith("en-gb")
        )
    );


  if(preferredVoice){

    utterance.voice =
      preferredVoice;

  }


  utterance.onend =
    function(){

      currentSpeechIndex++;

      /*
        Small pause between sentences
        makes it sound more natural.
      */

      setTimeout(
        speakNextChunk,
        80
      );

    };


  utterance.onerror =
    function(){

      isSpeaking = false;

      updateVoiceButton();

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==========================================
   STOP SPEAKING
========================================== */

function stopSpeaking(){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

  }


  speechQueue = [];

  currentSpeechIndex = 0;

  isSpeaking = false;

  updateVoiceButton();

}


/* ==========================================
   VOICE BUTTON STATE
========================================== */

function updateVoiceButton(){

  if(
    isSpeaking
  ){

    voiceToggle.textContent =
      "⏹ Stop Voice";

    voiceToggle.classList.add(
      "active"
    );

    return;

  }


  if(
    voiceEnabled
  ){

    voiceToggle.textContent =
      "🔊 Voice ON";

    voiceToggle.classList.add(
      "active"
    );

  }else{

    voiceToggle.textContent =
      "🔇 Voice OFF";

    voiceToggle.classList.remove(
      "active"
    );

  }

}


/* ==========================================
   ADD MESSAGE
========================================== */

function addMessage(
  role,
  content,
  speak = false
){

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message-row " +
    (
      role === "user"
      ? "user-row"
      : "ai-row"
    );


  if(role === "user"){

    const message =
      document.createElement(
        "div"
      );

    message.className =
      "message user";

    message.textContent =
      content;

    row.appendChild(
      message
    );

  }else{

    const container =
      document.createElement(
        "div"
      );

    container.className =
      "ai-container";


    const message =
      document.createElement(
        "div"
      );

    message.className =
      "message ai ai-content";

    message.innerHTML =
      renderMarkdown(
        content
      );


    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "ai-actions";


    const speaker =
      document.createElement(
        "button"
      );

    speaker.className =
      "action-btn";

    speaker.textContent =
      "🔊";

    speaker.title =
      "Read response";


    speaker.addEventListener(
      "click",
      ()=>{
        speakResponse(
          content
        );
      }
    );


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "action-btn";

    copy.textContent =
      "📋";

    copy.title =
      "Copy response";


    copy.addEventListener(
      "click",
      ()=>{
        copyResponse(
          copy
        );
      }
    );


    actions.appendChild(
      speaker
    );

    actions.appendChild(
      copy
    );


    container.appendChild(
      message
    );

    container.appendChild(
      actions
    );


    row.appendChild(
      container
    );


    if(speak){

      /*
        Start voice immediately after
        the AI response is rendered.
      */

      speakResponse(
        content
      );

    }

  }


  chat.appendChild(
    row
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* ==========================================
   THINKING
========================================== */

function showThinking(){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai-row";

  row.id =
    "thinkingMessage";


  row.innerHTML = `

    <div class="thinking-box">

      <span>Thinking</span>

      <div class="dots">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

    </div>

  `;


  chat.appendChild(
    row
  );


  chat.scrollTop =
    chat.scrollHeight;

}


function removeThinking(){

  const thinking =
    document.getElementById(
      "thinkingMessage"
    );


  if(thinking){

    thinking.remove();

  }

}


/* ==========================================
   LOAD CHAT
========================================== */

function loadConversation(){

  chat.innerHTML = "";


  if(
    conversation.length === 0
  ){

    addMessage(
      "assistant",
      "Hello! 👋 I'm NEXORA AI. How can I help you today?"
    );

    return;

  }


  conversation.forEach(
    message => {

      addMessage(
        message.role,
        message.content,
        false
      );

    }
  );

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage(){

  const message =
    input.value.trim();


  if(!message){
    return;
  }


  stopSpeaking();


  input.disabled = true;

  sendBtn.disabled = true;

  micBtn.disabled = true;


  addMessage(
    "user",
    message
  );


  /*
    Send previous messages only.
    Current message is sent separately.
  */

  const previousMessages =
    conversation.slice(-20);


  conversation.push({
    role:"user",
    content:message
  });


  saveConversation();


  input.value = "";


  showThinking();


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              messages:
                previousMessages

            })

        }
      );


    const data =
      await response.json();


    removeThinking();


    if(!response.ok){

      throw new Error(
        data?.error ||
        "Something went wrong."
      );

    }


    const reply =
      data?.reply ||
      "Sorry, I couldn't generate a response.";


    /*
      Text appears immediately,
      then voice starts right away.
    */

    addMessage(
      "assistant",
      reply,
      true
    );


    conversation.push({
      role:"assistant",
      content:reply
    });


    saveConversation();


  }catch(error){

    removeThinking();


    addMessage(
      "assistant",
      "Sorry, something went wrong. Please try again."
    );


    console.error(
      "NEXORA ERROR:",
      error
    );

  }


  input.disabled = false;

  sendBtn.disabled = false;

  micBtn.disabled = false;

  input.focus();

}


/* ==========================================
   CLEAR CHAT
========================================== */

clearBtn.addEventListener(
  "click",
  function(){

    const confirmed =
      confirm(
        "Clear all NEXORA AI conversation history?"
      );


    if(!confirmed){
      return;
    }


    stopSpeaking();


    conversation = [];


    localStorage.removeItem(
      "nexoraConversation"
    );


    loadConversation();

  }
);


/* ==========================================
   VOICE TOGGLE
========================================== */

voiceToggle.addEventListener(
  "click",
  function(){

    /*
      If currently speaking,
      clicking button stops voice.
    */

    if(isSpeaking){

      stopSpeaking();

      return;

    }


    voiceEnabled =
      !voiceEnabled;


    if(!voiceEnabled){

      stopSpeaking();

    }


    updateVoiceButton();

  }
);


updateVoiceButton();


/* ==========================================
   SEND BUTTON
========================================== */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* ==========================================
   ENTER
========================================== */

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ==========================================
   SPEECH RECOGNITION
========================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();


  /*
    English + Bangla mixed speech
    can work depending on browser.
    Change to bn-BD if you mainly speak Bangla.
  */

  recognition.lang =
    "en-US";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    function(){

      isListening = true;


      stopSpeaking();


      micBtn.classList.add(
        "listening"
      );


      micBtn.textContent =
        "⏹️";


      input.placeholder =
        "Listening...";

    };


  recognition.onresult =
    function(event){

      let transcript = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        transcript +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        transcript;


      /*
        If browser marks speech as final,
        prepare for automatic sending.
      */

      const lastResult =
        event.results[
          event.results.length - 1
        ];


      if(
        lastResult &&
        lastResult.isFinal
      ){

        setTimeout(
          function(){

            if(
              input.value.trim()
            ){

              sendMessage();

            }

          },
          300
        );

      }

    };


  recognition.onend =
    function(){

      isListening = false;


      micBtn.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎤";


      input.placeholder =
        "Ask NEXORA anything...";

    };


  recognition.onerror =
    function(event){

      console.error(
        "Voice recognition error:",
        event.error
      );


      isListening = false;


      micBtn.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎤";


      input.placeholder =
        "Ask NEXORA anything...";

    };


  micBtn.addEventListener(
    "click",
    function(){

      if(isListening){

        recognition.stop();

        return;

      }


      if(
        input.disabled
      ){
        return;
      }


      try{

        recognition.start();

      }catch(error){

        console.error(
          "Microphone error:",
          error
        );

      }

    }
  );


}else{

  micBtn.disabled = true;

  micBtn.title =
    "Voice input is not supported in this browser";

}


/* ==========================================
   START
========================================== */

loadConversation();

input.focus();

</script>
