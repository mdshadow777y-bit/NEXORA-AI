<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 95%;
      max-width: 900px;
      height: 90vh;

      background: #11182b;
      border: 1px solid #293451;
      border-radius: 20px;

      display: flex;
      flex-direction: column;
      overflow: hidden;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      padding: 20px 25px;

      border-bottom: 1px solid #293451;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #06b6d4
      );

      display: flex;
      justify-content: center;
      align-items: center;

      font-weight: bold;
      font-size: 18px;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }


    /* =========================
       HEADER BUTTONS
    ========================= */

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    #voiceToggle,
    #clearBtn {
      padding: 9px 13px;

      border: 1px solid #33415f;
      border-radius: 9px;

      background: #0c1325;
      color: #cbd5e1;

      cursor: pointer;
      font-size: 12px;
    }

    #voiceToggle:hover,
    #clearBtn:hover {
      border-color: #7c3aed;
      color: white;
    }

    #voiceToggle.active {
      background: #1e293b;
      border-color: #7c3aed;
      color: white;
    }


    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;

      padding: 25px;

      overflow-y: auto;
    }


    /* =========================
       MESSAGE ROW
    ========================= */

    .message-row {
      display: flex;

      width: 100%;

      margin-bottom: 15px;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .message-row.ai-row {
      justify-content: flex-start;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {
      max-width: 75%;

      padding: 14px 17px;

      border-radius: 15px;

      line-height: 1.5;

      white-space: pre-wrap;

      word-wrap: break-word;
    }

    .message.ai {
      background: #1b2540;

      border-top-left-radius: 4px;
    }

    .message.user {
      background: linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
      );

      border-top-right-radius: 4px;
    }


    /* =========================
       AI MESSAGE CONTROLS
    ========================= */

    .ai-container {
      display: flex;

      align-items: flex-start;

      gap: 7px;

      max-width: 80%;
    }

    .speaker-btn {
      width: 32px;
      height: 32px;

      flex-shrink: 0;

      border: 1px solid #33415f;

      border-radius: 8px;

      background: #0c1325;

      color: white;

      cursor: pointer;

      font-size: 14px;
    }

    .speaker-btn:hover {
      border-color: #7c3aed;
    }


    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      padding: 18px;

      border-top: 1px solid #293451;

      display: flex;

      gap: 10px;
    }

    #userInput {
      flex: 1;

      padding: 15px;

      border: 1px solid #33415f;

      border-radius: 12px;

      outline: none;

      background: #0c1325;

      color: white;

      font-size: 15px;
    }

    #userInput:focus {
      border-color: #7c3aed;
    }


    /* =========================
       MIC BUTTON
    ========================= */

    #micBtn {
      width: 50px;

      border: 1px solid #33415f;

      border-radius: 12px;

      background: #0c1325;

      color: white;

      font-size: 20px;

      cursor: pointer;
    }

    #micBtn:hover {
      border-color: #7c3aed;
    }

    #micBtn.listening {
      background: linear-gradient(
        135deg,
        #ef4444,
        #dc2626
      );

      border-color: #ef4444;

      animation: pulse 1s infinite;
    }


    @keyframes pulse {

      0% {
        box-shadow:
          0 0 0 0
          rgba(239, 68, 68, 0.5);
      }

      70% {
        box-shadow:
          0 0 0 10px
          rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow:
          0 0 0 0
          rgba(239, 68, 68, 0);
      }

    }


    /* =========================
       SEND BUTTON
    ========================= */

    #sendBtn {
      padding: 0 22px;

      border: none;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #2563eb
      );

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    #sendBtn:hover {
      opacity: 0.9;
    }

    #sendBtn:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .app {
        width: 100%;
        height: 100vh;

        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }

      .ai-container {
        max-width: 95%;
      }

      .header {
        padding: 15px;
      }

      .header p {
        display: none;
      }

      .header-buttons {
        gap: 5px;
      }

      #voiceToggle,
      #clearBtn {
        padding: 8px 9px;
      }

      .chat {
        padding: 15px;
      }

      .input-area {
        padding: 12px;
      }

      #sendBtn {
        padding: 0 16px;
      }

    }

  </style>

</head>


<body>

  <div class="app">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

      <div class="brand">

        <div class="logo">
          N
        </div>

        <div>

          <h1>
            NEXORA AI
          </h1>

          <p>
            Your intelligent AI assistant
          </p>

        </div>

      </div>


      <div class="header-buttons">

        <button id="voiceToggle">
          🔊 Voice ON
        </button>

        <button id="clearBtn">
          Clear Chat
        </button>

      </div>

    </div>


    <!-- =========================
         CHAT
    ========================= -->

    <div
      class="chat"
      id="chat"
    ></div>


    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask NEXORA anything..."
        autocomplete="off"
      >


      <button
        id="micBtn"
        title="Voice Input"
      >
        🎤
      </button>


      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>


  <script>


    // =========================================
    // NEXORA AI WORKER
    // =========================================

    const API_URL =
      "https://nexora-ai-api.md-shadow777y.workers.dev/";


    // =========================================
    // ELEMENTS
    // =========================================

    const input =
      document.getElementById("userInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const micBtn =
      document.getElementById("micBtn");

    const voiceToggle =
      document.getElementById("voiceToggle");

    const chat =
      document.getElementById("chat");


    // =========================================
    // MEMORY
    // =========================================

    let conversation =
      JSON.parse(
        localStorage.getItem(
          "nexoraConversation"
        )
      ) || [];


    // =========================================
    // VOICE OUTPUT STATE
    // =========================================

    let voiceEnabled = true;


    // =========================================
    // SAVE CONVERSATION
    // =========================================

    function saveConversation() {

      localStorage.setItem(
        "nexoraConversation",
        JSON.stringify(
          conversation
        )
      );

    }


    // =========================================
    // SPEAK TEXT
    // =========================================

    function speakText(text) {

      if (
        !voiceEnabled
      ) {
        return;
      }


      if (
        !("speechSynthesis" in window)
      ) {
        return;
      }


      // Stop previous speech

      window.speechSynthesis.cancel();


      // Create speech

      const speech =
        new SpeechSynthesisUtterance(
          text
        );


      // Voice settings

      speech.rate = 1;

      speech.pitch = 1;

      speech.volume = 1;


      // Try English voice

      const voices =
        window.speechSynthesis
          .getVoices();


      const englishVoice =
        voices.find(
          voice =>
            voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("en")
        );


      if (englishVoice) {

        speech.voice =
          englishVoice;

      }


      // Speak

      window.speechSynthesis.speak(
        speech
      );

    }


    // =========================================
    // STOP SPEAKING
    // =========================================

    function stopSpeaking() {

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();

      }

    }


    // =========================================
    // ADD MESSAGE
    // =========================================

    function addMessage(
      role,
      content,
      speak = false
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row " +
        (
          role === "user"
            ? "user-row"
            : "ai-row"
        );


      // =========================================
      // USER MESSAGE
      // =========================================

      if (
        role === "user"
      ) {

        const message =
          document.createElement(
            "div"
          );


        message.className =
          "message user";


        message.textContent =
          content;


        row.appendChild(
          message
        );

      }


      // =========================================
      // AI MESSAGE
      // =========================================

      else {

        const container =
          document.createElement(
            "div"
          );


        container.className =
          "ai-container";


        const message =
          document.createElement(
            "div"
          );


        message.className =
          "message ai";


        message.textContent =
          content;


        // Speaker button

        const speaker =
          document.createElement(
            "button"
          );


        speaker.className =
          "speaker-btn";


        speaker.textContent =
          "🔊";


        speaker.title =
          "Read this response";


        speaker.addEventListener(
          "click",
          function() {

            speakText(
              content
            );

          }
        );


        container.appendChild(
          message
        );

        container.appendChild(
          speaker
        );


        row.appendChild(
          container
        );


        // Auto voice

        if (speak) {

          speakText(
            content
          );

        }

      }


      chat.appendChild(
        row
      );


      chat.scrollTop =
        chat.scrollHeight;

    }


    // =========================================
    // LOAD CONVERSATION
    // =========================================

    function loadConversation() {

      chat.innerHTML = "";


      if (
        conversation.length === 0
      ) {

        addMessage(
          "assistant",
          "Hello! 👋 I'm NEXORA AI. How can I help you today?"
        );

        return;

      }


      conversation.forEach(
        message => {

          addMessage(
            message.role,
            message.content,
            false
          );

        }
      );

    }


    // =========================================
    // SEND MESSAGE
    // =========================================

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      // Stop current speech

      stopSpeaking();


      // Disable controls

      input.disabled = true;

      sendBtn.disabled = true;

      micBtn.disabled = true;


      // Show user

      addMessage(
        "user",
        message
      );


      // Save user

      conversation.push({

        role: "user",

        content: message

      });


      saveConversation();


      // Clear input

      input.value = "";


      // Thinking

      const thinking =
        document.createElement(
          "div"
        );


      thinking.className =
        "message-row ai-row";


      thinking.id =
        "thinkingMessage";


      const thinkingBox =
        document.createElement(
          "div"
        );


      thinkingBox.className =
        "message ai";


      thinkingBox.textContent =
        "Thinking...";


      thinking.appendChild(
        thinkingBox
      );


      chat.appendChild(
        thinking
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {


        // =========================================
        // SEND TO CLOUDFLARE
        // =========================================

        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  message:
                    message,

                  messages:
                    conversation.slice(
                      -20
                    )

                })

            }
          );


        const data =
          await response.json();


        // Remove thinking

        const thinkingMessage =
          document.getElementById(
            "thinkingMessage"
          );


        if (
          thinkingMessage
        ) {

          thinkingMessage.remove();

        }


        // API error

        if (
          !response.ok
        ) {

          throw new Error(
            data?.error ||
            "Something went wrong."
          );

        }


        // AI reply

        const reply =
          data?.reply ||
          "Sorry, I couldn't generate a response.";


        // Show AI

        addMessage(
          "assistant",
          reply,
          true
        );


        // Save AI

        conversation.push({

          role:
            "assistant",

          content:
            reply

        });


        saveConversation();


      }


      catch (error) {


        // Remove thinking

        const thinkingMessage =
          document.getElementById(
            "thinkingMessage"
          );


        if (
          thinkingMessage
        ) {

          thinkingMessage.remove();

        }


        addMessage(
          "assistant",
          "Sorry, something went wrong. Please try again."
        );


        console.error(
          "NEXORA ERROR:",
          error
        );

      }


      // Enable controls

      input.disabled = false;

      sendBtn.disabled = false;

      micBtn.disabled = false;

      input.focus();

    }


    // =========================================
    // CLEAR CHAT
    // =========================================

    clearBtn.addEventListener(
      "click",
      function() {

        const confirmed =
          confirm(
            "Clear all NEXORA AI conversation history?"
          );


        if (!confirmed) {
          return;
        }


        stopSpeaking();


        conversation = [];


        localStorage.removeItem(
          "nexoraConversation"
        );


        loadConversation();

      }
    );


    // =========================================
    // VOICE TOGGLE
    // =========================================

    voiceToggle.addEventListener(
      "click",
      function() {

        voiceEnabled =
          !voiceEnabled;


        if (
          voiceEnabled
        ) {

          voiceToggle.textContent =
            "🔊 Voice ON";

          voiceToggle.classList.add(
            "active"
          );

        }

        else {

          voiceToggle.textContent =
            "🔇 Voice OFF";

          voiceToggle.classList.remove(
            "active"
          );

          stopSpeaking();

        }

      }
    );


    // Initial voice state

    voiceToggle.classList.add(
      "active"
    );


    // =========================================
    // SEND BUTTON
    // =========================================

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // =========================================
    // ENTER KEY
    // =========================================

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );


    // =========================================
    // VOICE INPUT
    // =========================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition = null;

    let isListening = false;


    if (
      SpeechRecognition
    ) {

      recognition =
        new SpeechRecognition();


      recognition.lang =
        "en-US";


      recognition.continuous =
        false;


      recognition.interimResults =
        true;


      // Voice started

      recognition.onstart =
        function() {

          isListening =
            true;


          micBtn.classList.add(
            "listening"
          );


          micBtn.textContent =
            "⏹️";


          input.placeholder =
            "Listening...";

        };


      // Voice result

      recognition.onresult =
        function(event) {

          let transcript =
            "";


          for (
            let i =
              event.resultIndex;

            i <
              event.results.length;

            i++
          ) {

            transcript +=
              event.results[i][0]
                .transcript;

          }


          input.value =
            transcript;

        };


      // Voice ended

      recognition.onend =
        function() {

          isListening =
            false;


          micBtn.classList.remove(
            "listening"
          );


          micBtn.textContent =
            "🎤";


          input.placeholder =
            "Ask NEXORA anything...";

        };


      // Voice error

      recognition.onerror =
        function(event) {

          console.error(
            "Voice recognition error:",
            event.error
          );


          isListening =
            false;


          micBtn.classList.remove(
            "listening"
          );


          micBtn.textContent =
            "🎤";


          input.placeholder =
            "Ask NEXORA anything...";

        };


      // Mic click

      micBtn.addEventListener(
        "click",
        function() {

          if (
            isListening
          ) {

            recognition.stop();

            return;

          }


          try {

            recognition.start();

          }

          catch (error) {

            console.error(
              "Microphone error:",
              error
            );

          }

        }
      );

    }


    else {

      micBtn.disabled =
        true;

      micBtn.title =
        "Voice input is not supported in this browser";

    }


    // =========================================
    // START NEXORA
    // =========================================

    loadConversation();

    input.focus();

  </script>

</body>

</html>
