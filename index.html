<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEXORA AI</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b1020;
  color: white;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 95%;
  max-width: 1100px;
  height: 92vh;

  background: #11182b;

  border: 1px solid #293451;
  border-radius: 20px;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.4);
}


/* ==========================================
   HEADER
========================================== */

.header {
  padding: 14px 20px;

  border-bottom:
    1px solid #293451;

  display: flex;
  align-items: center;

  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #06b6d4
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 18px;
}

.header h1 {
  font-size: 22px;
}

.header p {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 3px;
}

.header-actions {
  margin-left: auto;

  display: flex;
  gap: 8px;
}

.top-btn {
  padding: 9px 13px;

  border-radius: 10px;

  border:
    1px solid #33415f;

  background: #11182b;

  color: white;

  cursor: pointer;
}

.top-btn:hover {
  border-color: #7c3aed;
}

#voiceToggle.active {
  border-color: #7c3aed;
  background: #191332;
}


/* ==========================================
   CHAT
========================================== */

.chat {
  flex: 1;

  padding: 25px;

  overflow-y: auto;

  scroll-behavior: smooth;
}

.message {
  max-width: 75%;

  padding: 14px 17px;

  margin-bottom: 15px;

  border-radius: 15px;

  line-height: 1.55;

  word-wrap: break-word;
}

.ai {
  background: #1b2540;

  border-top-left-radius: 4px;
}

.user {
  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  margin-left: auto;

  border-top-right-radius: 4px;
}


/* ==========================================
   MARKDOWN
========================================== */

.message h1,
.message h2,
.message h3 {
  margin:
    8px 0 10px;
}

.message strong {
  font-weight: 700;
}

.message ul,
.message ol {
  margin:
    8px 0 8px 20px;
}

.message li {
  margin-bottom: 7px;
}

.message p {
  margin-bottom: 8px;
}

.message p:last-child {
  margin-bottom: 0;
}


/* ==========================================
   CODE
========================================== */

.code-wrapper {
  margin-top: 10px;

  background: #0a0f1d;

  border:
    1px solid #33415f;

  border-radius: 10px;

  overflow: hidden;
}

.code-header {
  padding: 7px 10px;

  background: #151d31;

  display: flex;

  justify-content: space-between;
  align-items: center;

  font-size: 12px;

  color: #94a3b8;
}

.copy-code {
  border:
    1px solid #33415f;

  background: #0d1425;

  color: white;

  padding: 4px 8px;

  border-radius: 6px;

  cursor: pointer;

  font-size: 11px;
}

.code-wrapper pre {
  padding: 13px;

  overflow-x: auto;

  font-family: Consolas, monospace;

  font-size: 13px;

  line-height: 1.5;
}


/* ==========================================
   ACTION BUTTONS
========================================== */

.actions {
  display: flex;

  gap: 7px;

  margin-top: -7px;

  margin-bottom: 15px;
}

.action-btn {
  width: 33px;
  height: 33px;

  border:
    1px solid #33415f;

  background: #10182b;

  color: white;

  border-radius: 9px;

  cursor: pointer;
}

.action-btn:hover {
  border-color: #7c3aed;
}


/* ==========================================
   THINKING
========================================== */

.thinking {
  display: flex;
  gap: 5px;
  padding: 4px 2px;
}

.thinking span {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #94a3b8;

  animation:
    bounce 1.2s infinite ease-in-out;
}

.thinking span:nth-child(2) {
  animation-delay: .15s;
}

.thinking span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes bounce {

  0%, 60%, 100% {
    transform: translateY(0);
  }

  30% {
    transform: translateY(-5px);
  }

}


/* ==========================================
   INPUT
========================================== */

.input-area {
  padding: 16px;

  border-top:
    1px solid #293451;

  display: flex;

  gap: 9px;
}

#micBtn {
  width: 50px;

  border:
    1px solid #33415f;

  border-radius: 12px;

  background: #0c1325;

  color: white;

  cursor: pointer;

  font-size: 18px;
}

#micBtn.listening {
  border-color: #7c3aed;

  background: #21163c;
}

#userInput {
  flex: 1;

  padding: 14px;

  border:
    1px solid #33415f;

  border-radius: 12px;

  outline: none;

  background: #0c1325;

  color: white;

  font-size: 15px;
}

#userInput:focus {
  border-color: #7c3aed;
}

#sendBtn {
  padding: 0 20px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  color: white;

  font-weight: bold;

  cursor: pointer;
}

#sendBtn:disabled,
#micBtn:disabled {
  opacity: .5;
  cursor: not-allowed;
}


/* ==========================================
   ERROR MESSAGE
========================================== */

.error-message {
  white-space: pre-wrap;

  color: #ffd6d6;

  font-family: Consolas, monospace;

  font-size: 13px;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

  .app {
    width: 100%;
    height: 100vh;
    border-radius: 0;
  }

  .message {
    max-width: 90%;
  }

  .header {
    padding: 12px;
  }

  .header-actions {
    gap: 5px;
  }

  .top-btn {
    padding: 8px;
  }

  .chat {
    padding: 15px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      N
    </div>

    <div>

      <h1>NEXORA AI</h1>

      <p>
        Your intelligent AI assistant
      </p>

    </div>


    <div class="header-actions">

      <button
        class="top-btn active"
        id="voiceToggle"
      >
        🔊 Voice ON
      </button>

      <button
        class="top-btn"
        id="clearBtn"
      >
        Clear Chat
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  >

    <div class="message ai">

      Hello! 👋 I'm NEXORA AI.
      How can I help you today?

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <button
      id="micBtn"
      title="Voice input"
    >
      🎙️
    </button>

    <input
      type="text"
      id="userInput"
      placeholder="Ask NEXORA anything..."
      autocomplete="off"
    >

    <button id="sendBtn">
      Send
    </button>

  </div>

</div>


<script>


// ==========================================
// CONFIG
// ==========================================

const API_URL =
  "https://nexora-ai-api.md-shadow777y.workers.dev/";

const STORAGE_KEY =
  "nexora_conversation_v1";


// ==========================================
// ELEMENTS
// ==========================================

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("userInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const voiceToggle =
  document.getElementById("voiceToggle");

const clearBtn =
  document.getElementById("clearBtn");


// ==========================================
// STATE
// ==========================================

let conversation = [];

let voiceEnabled = true;

let isGenerating = false;

let recognition = null;

let isListening = false;


// ==========================================
// LOAD MEMORY
// ==========================================

try {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if (saved) {

    conversation =
      JSON.parse(saved);

    renderConversation();

  }

} catch (error) {

  console.error(
    "Memory load error:",
    error
  );

  conversation = [];

}


// ==========================================
// SAVE MEMORY
// ==========================================

function saveConversation() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      conversation
    )
  );

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(text) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================================
// MARKDOWN
// ==========================================

function renderMarkdown(text) {

  let codeBlocks = [];

  text =
    String(text).replace(
      /```(\w*)\n?([\s\S]*?)```/g,
      function(_, language, code) {

        const id =
          codeBlocks.length;

        codeBlocks.push({
          language:
            language || "code",

          code:
            code.trim()
        });

        return `___CODE_BLOCK_${id}___`;

      }
    );


  let html =
    escapeHTML(text);


  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  html =
    html.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );


  html =
    html.replace(
      /^\s*[-*] (.*)$/gm,
      "<li>$1</li>"
    );


  html =
    html.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );


  html =
    html.replace(
      /\n\n/g,
      "</p><p>"
    );


  html =
    html.replace(
      /\n/g,
      "<br>"
    );


  html =
    "<p>" +
    html +
    "</p>";


  codeBlocks.forEach(
    function(block, index) {

      const safeCode =
        escapeHTML(
          block.code
        );

      const codeHTML = `

        <div class="code-wrapper">

          <div class="code-header">

            <span>
              ${escapeHTML(block.language)}
            </span>

            <button
              class="copy-code"
              data-code="${encodeURIComponent(block.code)}"
            >
              Copy
            </button>

          </div>

          <pre><code>${safeCode}</code></pre>

        </div>

      `;

      html =
        html.replace(
          `___CODE_BLOCK_${index}___`,
          codeHTML
        );

    }
  );


  return html;

}


// ==========================================
// INITIAL MESSAGE
// ==========================================

function addInitialMessage() {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message ai";

  div.textContent =
    "Hello! 👋 I'm NEXORA AI. How can I help you today?";

  chat.appendChild(div);

}


// ==========================================
// RENDER CONVERSATION
// ==========================================

function renderConversation() {

  chat.innerHTML = "";

  if (!conversation.length) {

    addInitialMessage();

    return;

  }


  conversation.forEach(
    function(message) {

      if (
        message.role === "user"
      ) {

        addUserMessage(
          message.content,
          false
        );

      }

      if (
        message.role === "assistant"
      ) {

        addAIMessage(
          message.content,
          false
        );

      }

    }
  );


  scrollToBottom();

}


// ==========================================
// USER MESSAGE
// ==========================================

function addUserMessage(
  text,
  scroll = true
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message user";

  div.textContent =
    text;

  chat.appendChild(div);


  if (scroll) {
    scrollToBottom();
  }

}


// ==========================================
// AI MESSAGE
// ==========================================

function addAIMessage(
  text,
  scroll = true
) {

  const wrapper =
    document.createElement(
      "div"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";

  message.innerHTML =
    renderMarkdown(text);


  wrapper.appendChild(
    message
  );


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions";


  const speakButton =
    document.createElement(
      "button"
    );

  speakButton.className =
    "action-btn";

  speakButton.textContent =
    "🔊";

  speakButton.title =
    "Read aloud";


  speakButton.onclick =
    function() {

      speak(text);

    };


  const copyButton =
    document.createElement(
      "button"
    );

  copyButton.className =
    "action-btn";

  copyButton.textContent =
    "📋";

  copyButton.title =
    "Copy";


  copyButton.onclick =
    async function() {

      try {

        await navigator.clipboard.writeText(
          text
        );

        copyButton.textContent =
          "✓";

        setTimeout(
          function() {

            copyButton.textContent =
              "📋";

          },
          1000
        );

      } catch (error) {

        console.error(error);

      }

    };


  actions.appendChild(
    speakButton
  );

  actions.appendChild(
    copyButton
  );


  wrapper.appendChild(
    actions
  );

  chat.appendChild(
    wrapper
  );


  if (scroll) {
    scrollToBottom();
  }


  return message;

}


// ==========================================
// ERROR MESSAGE
// ==========================================

function addErrorMessage(
  title,
  details
) {

  const wrapper =
    document.createElement(
      "div"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";


  const safeTitle =
    escapeHTML(title);


  const safeDetails =
    escapeHTML(details);


  message.innerHTML = `

    <strong>
      ⚠️ ${safeTitle}
    </strong>

    <div
      class="error-message"
      style="margin-top:10px;"
    >
      ${safeDetails}
    </div>

  `;


  wrapper.appendChild(
    message
  );


  chat.appendChild(
    wrapper
  );


  scrollToBottom();

}


// ==========================================
// THINKING
// ==========================================

function showThinking() {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.id =
    "thinkingWrapper";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";


  message.innerHTML = `

    <div class="thinking">

      <span></span>
      <span></span>
      <span></span>

    </div>

  `;


  wrapper.appendChild(
    message
  );

  chat.appendChild(
    wrapper
  );


  scrollToBottom();

}


// ==========================================
// REMOVE THINKING
// ==========================================

function removeThinking() {

  const thinking =
    document.getElementById(
      "thinkingWrapper"
    );

  if (thinking) {
    thinking.remove();
  }

}


// ==========================================
// SCROLL
// ==========================================

function scrollToBottom() {

  chat.scrollTop =
    chat.scrollHeight;

}


// ==========================================
// SEND MESSAGE
// ==========================================

async function sendMessage() {

  const message =
    input.value.trim();


  if (
    !message ||
    isGenerating
  ) {
    return;
  }


  stopVoice();


  // Previous history only
  const previousMessages =
    conversation
      .filter(
        item =>
          item.role === "user" ||
          item.role === "assistant"
      )
      .slice(-20);


  // Save user message
  conversation.push({

    role: "user",

    content:
      message

  });


  saveConversation();


  addUserMessage(
    message
  );


  input.value = "";


  isGenerating = true;

  sendBtn.disabled = true;

  micBtn.disabled = true;


  showThinking();


  try {

    // ======================================
    // REQUEST
    // ======================================

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              messages:
                previousMessages

            })
        }
      );


    // ======================================
    // RESPONSE ERROR
    // ======================================

    if (!response.ok) {

      const errorText =
        await response.text();


      console.error(
        "NEXORA SERVER ERROR:",
        errorText
      );


      throw new Error(
        `HTTP ${response.status}\n\n${errorText}`
      );

    }


    if (!response.body) {

      throw new Error(
        "The server did not return a streaming response."
      );

    }


    removeThinking();


    // ======================================
    // CREATE STREAMING AI MESSAGE
    // ======================================

    const wrapper =
      document.createElement(
        "div"
      );


    const aiMessage =
      document.createElement(
        "div"
      );

    aiMessage.className =
      "message ai";


    aiMessage.innerHTML =
      "";


    wrapper.appendChild(
      aiMessage
    );


    // ======================================
    // ACTIONS
    // ======================================

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";


    const speakButton =
      document.createElement(
        "button"
      );

    speakButton.className =
      "action-btn";

    speakButton.textContent =
      "🔊";

    speakButton.title =
      "Read aloud";


    const copyButton =
      document.createElement(
        "button"
      );

    copyButton.className =
      "action-btn";

    copyButton.textContent =
      "📋";

    copyButton.title =
      "Copy";


    actions.appendChild(
      speakButton
    );

    actions.appendChild(
      copyButton
    );


    wrapper.appendChild(
      actions
    );


    chat.appendChild(
      wrapper
    );


    // ======================================
    // STREAM
    // ======================================

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder("utf-8");


    let buffer = "";

    let fullReply = "";


    while (true) {

      const {
        done,
        value
      } =
        await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      const events =
        buffer.split("\n\n");


      buffer =
        events.pop() || "";


      for (
        const event
        of events
      ) {

        const lines =
          event.split("\n");


        for (
          const line
          of lines
        ) {

          if (
            !line.startsWith("data:")
          ) {
            continue;
          }


          const data =
            line
              .slice(5)
              .trim();


          if (
            !data ||
            data === "[DONE]"
          ) {
            continue;
          }


          try {

            const parsed =
              JSON.parse(data);


            const token =
              parsed
                ?.choices?.[0]
                ?.delta?.content;


            if (token) {

              fullReply +=
                token;


              // LIVE TEXT
              aiMessage.innerHTML =
                renderMarkdown(
                  fullReply
                );


              scrollToBottom();

            }

          } catch (parseError) {

            console.log(
              "Stream parse:",
              data
            );

          }

        }

      }

    }


    // ======================================
    // CHECK RESPONSE
    // ======================================

    if (
      !fullReply.trim()
    ) {

      throw new Error(
        "NEXORA returned an empty response."
      );

    }


    // ======================================
    // BUTTONS
    // ======================================

    speakButton.onclick =
      function() {

        speak(fullReply);

      };


    copyButton.onclick =
      async function() {

        try {

          await navigator.clipboard.writeText(
            fullReply
          );

          copyButton.textContent =
            "✓";

          setTimeout(
            function() {

              copyButton.textContent =
                "📋";

            },
            1000
          );

        } catch (error) {

          console.error(error);

        }

      };


    // ======================================
    // SAVE AI RESPONSE
    // ======================================

    conversation.push({

      role: "assistant",

      content:
        fullReply

    });


    saveConversation();


    // ======================================
    // VOICE
    // ======================================

    if (
      voiceEnabled &&
      fullReply.trim()
    ) {

      speak(
        fullReply
      );

    }


  } catch (error) {

    removeThinking();


    console.error(
      "NEXORA ERROR:",
      error
    );


    addErrorMessage(
      "NEXORA request failed",
      error.message ||
      String(error)
    );


  } finally {

    isGenerating =
      false;

    sendBtn.disabled =
      false;

    micBtn.disabled =
      false;

    input.focus();

  }

}


// ==========================================
// ENTER KEY
// ==========================================

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// ==========================================
// SEND
// ==========================================

sendBtn.addEventListener(
  "click",
  sendMessage
);


// ==========================================
// VOICE OUTPUT
// ==========================================

function speak(text) {

  if (!voiceEnabled) {
    return;
  }


  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }


  speechSynthesis.cancel();


  let cleanText =
    text
      .replace(
        /```[\s\S]*?```/g,
        ""
      )
      .replace(
        /[*_#>`]/g,
        ""
      )
      .replace(
        /\[([^\]]+)\]\([^)]+\)/g,
        "$1"
      );


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  utterance.rate =
    1;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  const voices =
    speechSynthesis.getVoices();


  const englishVoice =
    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith("en")
    );


  if (englishVoice) {

    utterance.voice =
      englishVoice;

  }


  speechSynthesis.speak(
    utterance
  );

}


// ==========================================
// STOP VOICE
// ==========================================

function stopVoice() {

  if (
    "speechSynthesis" in window
  ) {

    speechSynthesis.cancel();

  }

}


// ==========================================
// VOICE TOGGLE
// ==========================================

voiceToggle.addEventListener(
  "click",
  function() {

    voiceEnabled =
      !voiceEnabled;


    if (!voiceEnabled) {

      stopVoice();

      voiceToggle.textContent =
        "🔇 Voice OFF";

      voiceToggle.classList.remove(
        "active"
      );

    } else {

      voiceToggle.textContent =
        "🔊 Voice ON";

      voiceToggle.classList.add(
        "active"
      );

    }

  }
);


// ==========================================
// SPEECH RECOGNITION
// ==========================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      isListening =
        true;

      micBtn.classList.add(
        "listening"
      );

      micBtn.textContent =
        "⏹️";

      stopVoice();

    };


  recognition.onresult =
    function(event) {

      let transcript =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0].transcript;

      }


      input.value =
        transcript;

    };


  recognition.onend =
    function() {

      isListening =
        false;

      micBtn.classList.remove(
        "listening"
      );

      micBtn.textContent =
        "🎙️";


      if (
        input.value.trim() &&
        !isGenerating
      ) {

        sendMessage();

      }

    };


  recognition.onerror =
    function(event) {

      console.error(
        "Speech recognition error:",
        event.error
      );


      isListening =
        false;

      micBtn.classList.remove(
        "listening"
      );

      micBtn.textContent =
        "🎙️";

    };


  micBtn.addEventListener(
    "click",
    function() {

      if (isGenerating) {
        return;
      }


      if (isListening) {

        recognition.stop();

        return;

      }


      try {

        recognition.start();

      } catch (error) {

        console.error(
          "Mic error:",
          error
        );

      }

    }
  );


} else {

  micBtn.disabled =
    true;

  micBtn.title =
    "Speech recognition is not supported in this browser.";

}


// ==========================================
// CLEAR CHAT
// ==========================================

clearBtn.addEventListener(
  "click",
  function() {

    const confirmed =
      confirm(
        "Clear the entire conversation?"
      );


    if (!confirmed) {
      return;
    }


    stopVoice();


    conversation =
      [];


    localStorage.removeItem(
      STORAGE_KEY
    );


    chat.innerHTML =
      "";


    addInitialMessage();

  }
);


// ==========================================
// COPY CODE
// ==========================================

document.addEventListener(
  "click",
  async function(event) {

    const button =
      event.target.closest(
        ".copy-code"
      );


    if (!button) {
      return;
    }


    const code =
      decodeURIComponent(
        button.dataset.code
      );


    try {

      await navigator.clipboard.writeText(
        code
      );


      button.textContent =
        "Copied!";


      setTimeout(
        function() {

          button.textContent =
            "Copy";

        },
        1200
      );


    } catch (error) {

      console.error(
        error
      );

    }

  }
);

</script>

</body>

</html>
