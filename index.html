<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEXORA AI</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #080d1a;
  color: white;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 96%;
  max-width: 1100px;
  height: 94vh;

  background: #11182b;

  border: 1px solid #293451;
  border-radius: 20px;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}


/* ==========================================
   HEADER
========================================== */

.header {
  min-height: 70px;

  padding: 12px 20px;

  border-bottom:
    1px solid #293451;

  display: flex;
  align-items: center;

  gap: 12px;

  flex-shrink: 0;
}

.logo {
  width: 42px;
  height: 42px;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #06b6d4
    );

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 18px;
  font-weight: bold;
}

.header h1 {
  font-size: 22px;
}

.header p {
  margin-top: 3px;

  font-size: 12px;

  color: #94a3b8;
}

.header-actions {
  margin-left: auto;

  display: flex;
  align-items: center;

  gap: 7px;
}

.top-btn {
  padding: 9px 12px;

  border-radius: 10px;

  border:
    1px solid #33415f;

  background: #11182b;

  color: white;

  cursor: pointer;

  font-size: 13px;
}

.top-btn:hover {
  border-color: #7c3aed;
}

.top-btn.active {
  border-color: #7c3aed;

  background: #1b1537;
}


/* ==========================================
   VOICE LANGUAGE
========================================== */

#voiceLanguage {
  padding: 8px 9px;

  border:
    1px solid #33415f;

  border-radius: 9px;

  background: #0c1325;

  color: white;

  outline: none;

  cursor: pointer;

  font-size: 12px;
}

#voiceLanguage:focus {
  border-color: #7c3aed;
}


/* ==========================================
   CHAT
========================================== */

.chat {
  flex: 1;

  padding: 25px;

  overflow-y: auto;

  scroll-behavior: smooth;

  min-height: 0;
}

.message {
  max-width: 75%;

  padding: 14px 17px;

  margin-bottom: 9px;

  border-radius: 15px;

  line-height: 1.55;

  word-wrap: break-word;
}

.ai {
  background: #1b2540;

  border-top-left-radius: 4px;
}

.user {
  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  margin-left: auto;

  border-top-right-radius: 4px;
}


/* ==========================================
   MARKDOWN
========================================== */

.message h1,
.message h2,
.message h3 {
  margin:
    8px 0 10px;
}

.message strong {
  font-weight: 700;
}

.message em {
  font-style: italic;
}

.message ul,
.message ol {
  margin:
    8px 0 8px 20px;
}

.message li {
  margin-bottom: 7px;
}

.message p {
  margin-bottom: 8px;
}

.message p:last-child {
  margin-bottom: 0;
}


/* ==========================================
   CODE
========================================== */

.code-wrapper {
  margin-top: 10px;

  background: #080d18;

  border:
    1px solid #33415f;

  border-radius: 10px;

  overflow: hidden;
}

.code-header {
  padding: 7px 10px;

  background: #151d31;

  display: flex;

  justify-content: space-between;
  align-items: center;

  color: #94a3b8;

  font-size: 12px;
}

.copy-code {
  padding: 4px 8px;

  border:
    1px solid #33415f;

  border-radius: 6px;

  background: #0d1425;

  color: white;

  cursor: pointer;

  font-size: 11px;
}

.code-wrapper pre {
  padding: 13px;

  overflow-x: auto;

  font-family: Consolas, monospace;

  font-size: 13px;

  line-height: 1.5;
}


/* ==========================================
   ACTION BUTTONS
========================================== */

.actions {
  display: flex;

  gap: 7px;

  margin-bottom: 14px;
}

.action-btn {
  width: 34px;
  height: 34px;

  border:
    1px solid #33415f;

  background: #10182b;

  color: white;

  border-radius: 9px;

  cursor: pointer;
}

.action-btn:hover {
  border-color: #7c3aed;
}


/* ==========================================
   THINKING
========================================== */

.thinking {
  display: flex;

  gap: 5px;

  padding: 4px 2px;
}

.thinking span {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #94a3b8;

  animation:
    thinkingBounce 1.2s infinite
    ease-in-out;
}

.thinking span:nth-child(2) {
  animation-delay: .15s;
}

.thinking span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes thinkingBounce {

  0%,
  60%,
  100% {
    transform: translateY(0);
  }

  30% {
    transform: translateY(-5px);
  }

}


/* ==========================================
   LISTENING STATUS
========================================== */

.listening-status {
  display: none;

  padding: 7px 14px;

  border-top:
    1px solid #293451;

  background: #11182b;

  color: #a78bfa;

  font-size: 12px;

  text-align: center;
}

.listening-status.show {
  display: block;
}


/* ==========================================
   INPUT
========================================== */

.input-area {
  padding: 15px;

  border-top:
    1px solid #293451;

  display: flex;

  gap: 9px;

  flex-shrink: 0;

  background: #11182b;
}

#micBtn {
  width: 50px;

  flex-shrink: 0;

  border:
    1px solid #33415f;

  border-radius: 12px;

  background: #0c1325;

  color: white;

  cursor: pointer;

  font-size: 18px;
}

#micBtn:hover {
  border-color: #7c3aed;
}

#micBtn.listening {
  border-color: #7c3aed;

  background: #29174b;

  animation:
    micPulse 1.2s infinite;
}

@keyframes micPulse {

  0% {
    box-shadow:
      0 0 0 0
      rgba(124,58,237,.5);
  }

  70% {
    box-shadow:
      0 0 0 8px
      rgba(124,58,237,0);
  }

  100% {
    box-shadow:
      0 0 0 0
      rgba(124,58,237,0);
  }

}

#userInput {
  flex: 1;

  min-width: 0;

  padding: 14px;

  border:
    1px solid #33415f;

  border-radius: 12px;

  outline: none;

  background: #0c1325;

  color: white;

  font-size: 15px;
}

#userInput:focus {
  border-color: #7c3aed;
}

#sendBtn {
  padding: 0 20px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #2563eb
    );

  color: white;

  font-weight: bold;

  cursor: pointer;
}

#sendBtn:hover {
  opacity: .9;
}

#sendBtn:disabled,
#micBtn:disabled {
  opacity: .5;

  cursor: not-allowed;
}


/* ==========================================
   ERROR
========================================== */

.error-message {
  white-space: pre-wrap;

  color: #ffd6d6;

  font-family: Consolas, monospace;

  font-size: 13px;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

  .app {
    width: 100%;
    height: 100vh;

    border-radius: 0;
  }

  .header {
    padding: 10px 12px;
  }

  .header h1 {
    font-size: 19px;
  }

  .header p {
    display: none;
  }

  .header-actions {
    gap: 4px;
  }

  .top-btn {
    padding: 8px;
  }

  #voiceLanguage {
    display: none;
  }

  .chat {
    padding: 15px;
  }

  .message {
    max-width: 90%;
  }

  .input-area {
    padding: 10px;
  }

  #sendBtn {
    padding: 0 15px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- ======================================
       HEADER
  ======================================= -->

  <div class="header">

    <div class="logo">
      N
    </div>

    <div>

      <h1>
        NEXORA AI
      </h1>

      <p>
        Your intelligent AI assistant
      </p>

    </div>


    <div class="header-actions">

      <select
        id="voiceLanguage"
        title="Voice language"
      >

        <option value="en-US">
          English
        </option>

        <option value="bn-BD">
          বাংলা
        </option>

        <option value="en-US">
          Banglish
        </option>

      </select>


      <button
        class="top-btn active"
        id="voiceToggle"
      >
        🔊 Voice ON
      </button>


      <button
        class="top-btn"
        id="stopVoiceBtn"
        style="display:none;"
      >
        ⏹ Stop
      </button>


      <button
        class="top-btn"
        id="clearBtn"
      >
        Clear Chat
      </button>

    </div>

  </div>


  <!-- ======================================
       CHAT
  ======================================= -->

  <div
    class="chat"
    id="chat"
  >

    <div class="message ai">

      Hello! 👋 I'm NEXORA AI.
      How can I help you today?

    </div>

  </div>


  <!-- ======================================
       LISTENING STATUS
  ======================================= -->

  <div
    class="listening-status"
    id="listeningStatus"
  >
    🎙️ Listening... Speak now
  </div>


  <!-- ======================================
       INPUT
  ======================================= -->

  <div class="input-area">

    <button
      id="micBtn"
      title="Voice input"
    >
      🎙️
    </button>


    <input
      type="text"
      id="userInput"
      placeholder="Ask NEXORA anything..."
      autocomplete="off"
    >


    <button
      id="sendBtn"
    >
      Send
    </button>

  </div>


</div>


<script>


// =====================================================
// CONFIG
// =====================================================

const API_URL =
  "https://nexora-ai-api.md-shadow777y-bit.workers.dev/";


/*
 IMPORTANT:

 If your current Worker URL is:

 https://nexora-ai-api.md-shadow777y.workers.dev/

then KEEP THIS URL instead:

const API_URL =
  "https://nexora-ai-api.md-shadow777y.workers.dev/";
*/

const STORAGE_KEY =
  "nexora_conversation_v1";


// =====================================================
// ELEMENTS
// =====================================================

const chat =
  document.getElementById(
    "chat"
  );

const input =
  document.getElementById(
    "userInput"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const micBtn =
  document.getElementById(
    "micBtn"
  );

const voiceToggle =
  document.getElementById(
    "voiceToggle"
  );

const stopVoiceBtn =
  document.getElementById(
    "stopVoiceBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const voiceLanguage =
  document.getElementById(
    "voiceLanguage"
  );

const listeningStatus =
  document.getElementById(
    "listeningStatus"
  );


// =====================================================
// STATE
// =====================================================

let conversation = [];

let voiceEnabled = true;

let isGenerating = false;

let recognition = null;

let isListening = false;

let currentSpeakingText = "";


// =====================================================
// LOAD MEMORY
// =====================================================

try {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if (saved) {

    conversation =
      JSON.parse(saved);

    renderConversation();

  }

} catch (error) {

  console.error(
    "Memory load error:",
    error
  );

  conversation = [];

}


// =====================================================
// SAVE MEMORY
// =====================================================

function saveConversation() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        conversation
      )
    );

  } catch (error) {

    console.error(
      "Memory save error:",
      error
    );

  }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// MARKDOWN RENDERER
// =====================================================

function renderMarkdown(text) {

  let codeBlocks = [];


  text =
    String(text).replace(
      /```(\w*)\n?([\s\S]*?)```/g,

      function(
        _,
        language,
        code
      ) {

        const id =
          codeBlocks.length;

        codeBlocks.push({

          language:
            language ||
            "code",

          code:
            code.trim()

        });

        return (
          `___CODE_BLOCK_${id}___`
        );

      }
    );


  let html =
    escapeHTML(text);


  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  html =
    html.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );


  html =
    html.replace(
      /^\s*[-*] (.*)$/gm,
      "<li>$1</li>"
    );


  html =
    html.replace(
      /(<li>.*<\/li>)/gs,
      "<ul>$1</ul>"
    );


  html =
    html.replace(
      /\n\n/g,
      "</p><p>"
    );


  html =
    html.replace(
      /\n/g,
      "<br>"
    );


  html =
    "<p>" +
    html +
    "</p>";


  codeBlocks.forEach(
    function(
      block,
      index
    ) {

      const safeCode =
        escapeHTML(
          block.code
        );


      const codeHTML = `

        <div class="code-wrapper">

          <div class="code-header">

            <span>
              ${escapeHTML(
                block.language
              )}
            </span>

            <button
              class="copy-code"
              data-code="${encodeURIComponent(
                block.code
              )}"
            >
              Copy
            </button>

          </div>

          <pre><code>${safeCode}</code></pre>

        </div>

      `;


      html =
        html.replace(
          `___CODE_BLOCK_${index}___`,
          codeHTML
        );

    }
  );


  return html;

}


// =====================================================
// INITIAL MESSAGE
// =====================================================

function addInitialMessage() {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message ai";

  div.textContent =
    "Hello! 👋 I'm NEXORA AI. How can I help you today?";

  chat.appendChild(
    div
  );

}


// =====================================================
// RENDER CONVERSATION
// =====================================================

function renderConversation() {

  chat.innerHTML = "";


  if (
    !conversation.length
  ) {

    addInitialMessage();

    return;

  }


  conversation.forEach(
    function(message) {

      if (
        message.role === "user"
      ) {

        addUserMessage(
          message.content,
          false
        );

      }


      if (
        message.role === "assistant"
      ) {

        addAIMessage(
          message.content,
          false
        );

      }

    }
  );


  scrollToBottom();

}


// =====================================================
// USER MESSAGE
// =====================================================

function addUserMessage(
  text,
  scroll = true
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message user";

  div.textContent =
    text;

  chat.appendChild(
    div
  );


  if (scroll) {

    scrollToBottom();

  }

}


// =====================================================
// AI MESSAGE
// =====================================================

function addAIMessage(
  text,
  scroll = true
) {

  const wrapper =
    document.createElement(
      "div"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";

  message.innerHTML =
    renderMarkdown(
      text
    );


  wrapper.appendChild(
    message
  );


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions";


  const speakButton =
    document.createElement(
      "button"
    );

  speakButton.className =
    "action-btn";

  speakButton.textContent =
    "🔊";

  speakButton.title =
    "Read aloud";


  speakButton.onclick =
    function() {

      speak(text);

    };


  const copyButton =
    document.createElement(
      "button"
    );

  copyButton.className =
    "action-btn";

  copyButton.textContent =
    "📋";

  copyButton.title =
    "Copy";


  copyButton.onclick =
    async function() {

      try {

        await navigator.clipboard.writeText(
          text
        );

        copyButton.textContent =
          "✓";


        setTimeout(
          function() {

            copyButton.textContent =
              "📋";

          },
          1000
        );

      } catch (error) {

        console.error(
          error
        );

      }

    };


  actions.appendChild(
    speakButton
  );

  actions.appendChild(
    copyButton
  );


  wrapper.appendChild(
    actions
  );


  chat.appendChild(
    wrapper
  );


  if (scroll) {

    scrollToBottom();

  }


  return message;

}


// =====================================================
// ERROR
// =====================================================

function addErrorMessage(
  title,
  details
) {

  const wrapper =
    document.createElement(
      "div"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";


  message.innerHTML = `

    <strong>
      ⚠️ ${escapeHTML(title)}
    </strong>

    <div
      class="error-message"
      style="margin-top:10px;"
    >
      ${escapeHTML(details)}
    </div>

  `;


  wrapper.appendChild(
    message
  );


  chat.appendChild(
    wrapper
  );


  scrollToBottom();

}


// =====================================================
// THINKING
// =====================================================

function showThinking() {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.id =
    "thinkingWrapper";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message ai";


  message.innerHTML = `

    <div class="thinking">

      <span></span>
      <span></span>
      <span></span>

    </div>

  `;


  wrapper.appendChild(
    message
  );


  chat.appendChild(
    wrapper
  );


  scrollToBottom();

}


// =====================================================
// REMOVE THINKING
// =====================================================

function removeThinking() {

  const thinking =
    document.getElementById(
      "thinkingWrapper"
    );


  if (thinking) {

    thinking.remove();

  }

}


// =====================================================
// SCROLL
// =====================================================

function scrollToBottom() {

  chat.scrollTop =
    chat.scrollHeight;

}


// =====================================================
// CLEAN TEXT FOR SPEECH
// =====================================================

function cleanTextForSpeech(
  text
) {

  return String(text)

    .replace(
      /```[\s\S]*?```/g,
      ""
    )

    .replace(
      /#{1,6}\s*/g,
      ""
    )

    .replace(
      /\*\*(.*?)\*\*/g,
      "$1"
    )

    .replace(
      /\*(.*?)\*/g,
      "$1"
    )

    .replace(
      /`([^`]+)`/g,
      "$1"
    )

    .replace(
      /\[([^\]]+)\]\([^)]+\)/g,
      "$1"
    )

    .replace(
      /\n+/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


// =====================================================
// SELECT BEST VOICE
// =====================================================

function getBestVoice(
  language
) {

  if (
    !("speechSynthesis" in window)
  ) {

    return null;

  }


  const voices =
    speechSynthesis.getVoices();


  if (!voices.length) {

    return null;

  }


  const wanted =
    language.toLowerCase();


  // Exact language
  let voice =
    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase() === wanted
    );


  if (voice) {

    return voice;

  }


  // Language family
  const family =
    wanted.split("-")[0];


  voice =
    voices.find(
      v =>
        v.lang &&
        v.lang
          .toLowerCase()
          .startsWith(
            family
          )
    );


  if (voice) {

    return voice;

  }


  // English fallback
  if (
    family === "en"
  ) {

    voice =
      voices.find(
        v =>
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("en")
      );

  }


  // Bengali fallback
  if (
    family === "bn"
  ) {

    voice =
      voices.find(
        v =>
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("bn")
      );

  }


  return voice || voices[0];

}


// =====================================================
// SPEAK
// =====================================================

function speak(
  text
) {

  if (!voiceEnabled) {

    return;

  }


  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  stopSpeaking();


  const cleanText =
    cleanTextForSpeech(
      text
    );


  if (!cleanText) {

    return;

  }


  currentSpeakingText =
    cleanText;


  const selectedLanguage =
    voiceLanguage.value;


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  utterance.lang =
    selectedLanguage;


  utterance.rate =
    selectedLanguage === "bn-BD"
      ? 0.95
      : 1.0;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  const voice =
    getBestVoice(
      selectedLanguage
    );


  if (voice) {

    utterance.voice =
      voice;

  }


  utterance.onstart =
    function() {

      stopVoiceBtn.style.display =
        "inline-block";

    };


  utterance.onend =
    function() {

      stopVoiceBtn.style.display =
        "none";

      currentSpeakingText =
        "";

    };


  utterance.onerror =
    function() {

      stopVoiceBtn.style.display =
        "none";

      currentSpeakingText =
        "";

    };


  speechSynthesis.speak(
    utterance
  );

}


// =====================================================
// STOP SPEAKING
// =====================================================

function stopSpeaking() {

  if (
    "speechSynthesis" in window
  ) {

    speechSynthesis.cancel();

  }


  stopVoiceBtn.style.display =
    "none";

  currentSpeakingText =
    "";

}


// =====================================================
// VOICE STOP BUTTON
// =====================================================

stopVoiceBtn.addEventListener(
  "click",
  function() {

    stopSpeaking();

  }
);


// =====================================================
// VOICE TOGGLE
// =====================================================

voiceToggle.addEventListener(
  "click",
  function() {

    voiceEnabled =
      !voiceEnabled;


    if (!voiceEnabled) {

      stopSpeaking();


      voiceToggle.textContent =
        "🔇 Voice OFF";


      voiceToggle.classList.remove(
        "active"
      );

    } else {

      voiceToggle.textContent =
        "🔊 Voice ON";


      voiceToggle.classList.add(
        "active"
      );

    }

  }
);


// =====================================================
// SPEECH RECOGNITION
// =====================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      isListening =
        true;


      // Stop AI voice immediately
      stopSpeaking();


      micBtn.classList.add(
        "listening"
      );


      micBtn.textContent =
        "⏹️";


      listeningStatus.classList.add(
        "show"
      );


      listeningStatus.textContent =
        "🎙️ Listening... Speak now";

    };


  recognition.onresult =
    function(event) {

      let transcript =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        transcript +=
          event.results[i][0].transcript;

      }


      input.value =
        transcript.trim();


      scrollToBottom();

    };


  recognition.onend =
    function() {

      isListening =
        false;


      micBtn.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎙️";


      listeningStatus.classList.remove(
        "show"
      );


      // Auto send
      if (
        input.value.trim() &&
        !isGenerating
      ) {

        setTimeout(
          function() {

            sendMessage();

          },
          150
        );

      }

    };


  recognition.onerror =
    function(event) {

      console.error(
        "Speech recognition error:",
        event.error
      );


      isListening =
        false;


      micBtn.classList.remove(
        "listening"
      );


      micBtn.textContent =
        "🎙️";


      listeningStatus.classList.remove(
        "show"
      );


      if (
        event.error ===
        "not-allowed"
      ) {

        listeningStatus.textContent =
          "⚠️ Microphone permission denied.";

      }


      if (
        event.error ===
        "no-speech"
      ) {

        listeningStatus.textContent =
          "🎙️ No speech detected.";

      }

    };


  micBtn.addEventListener(
    "click",
    function() {

      // If AI is speaking:
      // stop it and start microphone.
      if (
        "speechSynthesis" in window &&
        speechSynthesis.speaking
      ) {

        stopSpeaking();

      }


      if (isListening) {

        recognition.stop();

        return;

      }


      if (isGenerating) {

        return;

      }


      try {

        // Current selected voice language
        recognition.lang =
          voiceLanguage.value;


        recognition.start();

      } catch (error) {

        console.error(
          "Recognition start error:",
          error
        );

      }

    }
  );


} else {

  micBtn.disabled =
    true;


  micBtn.title =
    "Speech recognition is not supported in this browser.";

}


// =====================================================
// VOICE LANGUAGE CHANGE
// =====================================================

voiceLanguage.addEventListener(
  "change",
  function() {

    if (isListening) {

      recognition.stop();

    }


    stopSpeaking();

  }
);


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

  const message =
    input.value.trim();


  if (
    !message ||
    isGenerating
  ) {

    return;

  }


  // Stop voice
  stopSpeaking();


  // Stop recognition
  if (
    recognition &&
    isListening
  ) {

    try {

      recognition.stop();

    } catch (error) {}

  }


  // Previous history
  const previousMessages =
    conversation
      .filter(
        item =>
          item.role === "user" ||
          item.role === "assistant"
      )
      .slice(-20);


  // Save user message
  conversation.push({

    role: "user",

    content:
      message

  });


  saveConversation();


  addUserMessage(
    message
  );


  input.value =
    "";


  isGenerating =
    true;


  sendBtn.disabled =
    true;


  micBtn.disabled =
    true;


  showThinking();


  try {

    // ==========================================
    // REQUEST
    // ==========================================

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                message,

              messages:
                previousMessages

            })

        }
      );


    // ==========================================
    // ERROR
    // ==========================================

    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        `HTTP ${response.status}\n\n${errorText}`
      );

    }


    if (!response.body) {

      throw new Error(
        "The server did not return a streaming response."
      );

    }


    removeThinking();


    // ==========================================
    // CREATE AI MESSAGE
    // ==========================================

    const wrapper =
      document.createElement(
        "div"
      );


    const aiMessage =
      document.createElement(
        "div"
      );


    aiMessage.className =
      "message ai";


    aiMessage.innerHTML =
      "";


    wrapper.appendChild(
      aiMessage
    );


    // ==========================================
    // ACTION BUTTONS
    // ==========================================

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "actions";


    const speakButton =
      document.createElement(
        "button"
      );


    speakButton.className =
      "action-btn";


    speakButton.textContent =
      "🔊";


    speakButton.title =
      "Read aloud";


    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.className =
      "action-btn";


    copyButton.textContent =
      "📋";


    copyButton.title =
      "Copy";


    actions.appendChild(
      speakButton
    );


    actions.appendChild(
      copyButton
    );


    wrapper.appendChild(
      actions
    );


    chat.appendChild(
      wrapper
    );


    // ==========================================
    // STREAM
    // ==========================================

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let buffer =
      "";


    let fullReply =
      "";


    while (true) {

      const {
        done,
        value
      } =
        await reader.read();


      if (done) {

        break;

      }


      buffer +=
        decoder.decode(
          value,
          {
            stream:
              true
          }
        );


      const events =
        buffer.split(
          "\n\n"
        );


      buffer =
        events.pop() ||
        "";


      for (
        const event
        of events
      ) {

        const lines =
          event.split(
            "\n"
          );


        for (
          const line
          of lines
        ) {

          if (
            !line.startsWith(
              "data:"
            )
          ) {

            continue;

          }


          const data =
            line
              .slice(5)
              .trim();


          if (
            !data ||
            data === "[DONE]"
          ) {

            continue;

          }


          try {

            const parsed =
              JSON.parse(
                data
              );


            const token =
              parsed
                ?.choices?.[0]
                ?.delta?.content;


            if (token) {

              fullReply +=
                token;


              aiMessage.innerHTML =
                renderMarkdown(
                  fullReply
                );


              scrollToBottom();

            }

          } catch (parseError) {

            console.log(
              "Stream chunk:",
              data
            );

          }

        }

      }

    }


    // ==========================================
    // EMPTY RESPONSE
    // ==========================================

    if (
      !fullReply.trim()
    ) {

      throw new Error(
        "NEXORA returned an empty response."
      );

    }


    // ==========================================
    // BUTTONS
    // ==========================================

    speakButton.onclick =
      function() {

        speak(
          fullReply
        );

      };


    copyButton.onclick =
      async function() {

        try {

          await navigator.clipboard.writeText(
            fullReply
          );


          copyButton.textContent =
            "✓";


          setTimeout(
            function() {

              copyButton.textContent =
                "📋";

            },
            1000
          );


        } catch (error) {

          console.error(
            error
          );

        }

      };


    // ==========================================
    // SAVE
    // ==========================================

    conversation.push({

      role:
        "assistant",

      content:
        fullReply

    });


    saveConversation();


    // ==========================================
    // AUTO VOICE
    // ==========================================

    if (
      voiceEnabled &&
      fullReply.trim()
    ) {

      // Small delay gives UI time to finish rendering
      setTimeout(
        function() {

          speak(
            fullReply
          );

        },
        100
      );

    }


  } catch (error) {

    removeThinking();


    console.error(
      "NEXORA ERROR:",
      error
    );


    addErrorMessage(
      "NEXORA request failed",
      error.message ||
      String(error)
    );

  } finally {

    isGenerating =
      false;


    sendBtn.disabled =
      false;


    micBtn.disabled =
      false;


    input.focus();

  }

}


// =====================================================
// SEND BUTTON
// =====================================================

sendBtn.addEventListener(
  "click",
  sendMessage
);


// =====================================================
// ENTER
// =====================================================

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// =====================================================
// CLEAR CHAT
// =====================================================

clearBtn.addEventListener(
  "click",
  function() {

    const confirmed =
      confirm(
        "Clear the entire conversation?"
      );


    if (!confirmed) {

      return;

    }


    stopSpeaking();


    if (
      recognition &&
      isListening
    ) {

      try {

        recognition.stop();

      } catch (error) {}

    }


    conversation =
      [];


    localStorage.removeItem(
      STORAGE_KEY
    );


    chat.innerHTML =
      "";


    addInitialMessage();

  }
);


// =====================================================
// COPY CODE
// =====================================================

document.addEventListener(
  "click",
  async function(event) {

    const button =
      event.target.closest(
        ".copy-code"
      );


    if (!button) {

      return;

    }


    const code =
      decodeURIComponent(
        button.dataset.code
      );


    try {

      await navigator.clipboard.writeText(
        code
      );


      button.textContent =
        "Copied!";


      setTimeout(
        function() {

          button.textContent =
            "Copy";

        },
        1200
      );


    } catch (error) {

      console.error(
        error
      );

    }

  }
);


// =====================================================
// LOAD AVAILABLE VOICES
// =====================================================

if (
  "speechSynthesis" in window
) {

  speechSynthesis.onvoiceschanged =
    function() {

      speechSynthesis.getVoices();

    };

}


</script>
